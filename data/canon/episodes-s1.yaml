# The Mentalist, season 1. Source: English Wikipedia, "List of The Mentalist episodes" (broadcast order).
# Spoilers: do not open outside the app.

episodes:
  - code: S1E1
    title: "Pilot"
    synopsis: "The team works a new case."
    details: ""
  - code: S1E2
    title: "Red Hair and Silver Tape"
    synopsis: "A teenage girl is found dead in a vineyard, apparently the latest victim of a predator who targets red-haired women."
    details: ""
  - code: S1E3
    title: "Red Tide"
    synopsis: "A high-school girl's body washes up on a state beach after a night out with her friends."
    details: ""
  - code: S1E4
    title: "Ladies in Red"
    synopsis: "A wealthy investment banker is found dead inside a hidden room in his own home."
    details: ""
  - code: S1E5
    title: "Redwood"
    synopsis: "A bloodstained car is found abandoned near a logging town, linked to two missing girls."
    details: ""
  - code: S1E6
    title: "Red Handed"
    synopsis: "A casino operations manager is found murdered, his hand left lying on the California-Nevada line."
    details: ""
  - code: S1E7
    title: "Seeing Red"
    synopsis: "A wealthy heiress is killed in a hit-and-run, hours after her psychic predicted it."
    details: ""
  - code: S1E8
    title: "The Thin Red Line"
    synopsis: "A witness in a drug trial and his girlfriend are shot dead in a motel room."
    details: ""
  - code: S1E9
    title: "Flame Red"
    synopsis: "A war veteran is found dead after a fire in a small farming town."
    details: ""
  - code: S1E10
    title: "Red Brick and Ivy"
    synopsis: "A leading university researcher is found poisoned."
    details: ""
  - code: S1E11
    title: "Red John's Friends"
    synopsis: "The team works a new case."
    details: ""
  - code: S1E12
    title: "Red Rum"
    synopsis: "A high-school football star is found dead, surrounded by occult symbols."
    details: ""
  - code: S1E13
    title: "Paint it Red"
    synopsis: "A fifty-million-dollar painting is stolen from an oil tycoon's office, and a man is found dead nearby."
    details: ""
  - code: S1E14
    title: "Crimson Casanova"
    synopsis: "A millionaire's wife is found shot after a secret rendezvous."
    details: ""
  - code: S1E15
    title: "Scarlett Fever"
    synopsis: "The chair of a country club's women's committee is poisoned at a cocktail party in her own home."
    details: ""
  - code: S1E16
    title: "Bloodshot"
    synopsis: "A stockbroker is killed in a bombing that follows a threat sent to the office."
    details: ""
  - code: S1E17
    title: "Carnelian Inc."
    synopsis: "An anonymous threat names the time and place of a murder at a corporate retreat in the mountains."
    details: ""
  - code: S1E18
    title: "Russet Potatoes"
    synopsis: "A man brings what he believes is a sack of potatoes to the police, and it turns out to be a corpse."
    details: ""
  - code: S1E19
    title: "A Dozen Red Roses"
    synopsis: "A movie producer is found murdered in Hollywood."
    details: ""
  - code: S1E20
    title: "Red Sauce"
    synopsis: "A mob informant living under witness protection is found shot dead by a river."
    details: ""
  - code: S1E21
    title: "Miss Red"
    synopsis: "The founder of a software company is found dead on his yacht in an exclusive harbor."
    details: ""
  - code: S1E22
    title: "Blood Brothers"
    synopsis: "A student at a wilderness program for troubled youth is found dead."
    details: ""
  - code: S1E23
    title: "Red John's Footsteps"
    synopsis: "The team works a new case."
    details: ""

