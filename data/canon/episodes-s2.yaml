# The Mentalist, season 2. Source: English Wikipedia, "List of The Mentalist episodes" (broadcast order).
# Spoilers: do not open outside the app.

episodes:
  - code: S2E1
    title: "Redemption"
    synopsis: "A woman is found suffocated after being accused of stealing a million dollars from her employer."
    details: ""
  - code: S2E2
    title: "The Scarlet Letter"
    synopsis: "A state senator's young aide is found murdered."
    details: ""
  - code: S2E3
    title: "Red Badge"
    synopsis: "An anonymous tip leads the team to the body of a man with a criminal record."
    details: ""
  - code: S2E4
    title: "Red Menace"
    synopsis: "A lawyer is found murdered by the roadside; his only client was a motorcycle gang."
    details: ""
  - code: S2E5
    title: "Red Scare"
    synopsis: "The new owner of an old mansion is found murdered on the property."
    details: ""
  - code: S2E6
    title: "Black Gold and Red Blood"
    synopsis: "The team works a new case."
    details: ""
  - code: S2E7
    title: "Red Bulls"
    synopsis: "The team investigates the kidnapping of a wealthy woman's sister."
    details: ""
  - code: S2E8
    title: "His Red Right Hand"
    synopsis: "The team works a new case."
    details: ""
  - code: S2E9
    title: "A Price Above Rubies"
    synopsis: "A jeweler is shot during a robbery at his store after a charity fundraiser."
    details: ""
  - code: S2E10
    title: "Throwing Fire"
    synopsis: "A former professional baseball player who founded a baseball academy is found dead in his Zen garden."
    details: ""
  - code: S2E11
    title: "Rose-Colored Glasses"
    synopsis: "A married couple is found murdered on their way to a high-school reunion."
    details: ""
  - code: S2E12
    title: "Bleeding Heart"
    synopsis: "A mayor's aide is found buried at the site of a construction groundbreaking."
    details: ""
  - code: S2E13
    title: "Redline"
    synopsis: "A young saleswoman is found dead in the trunk of a car at a luxury car dealership."
    details: ""
  - code: S2E14
    title: "Blood In, Blood Out"
    synopsis: "The team investigates the murder of a young man with gang ties."
    details: ""
  - code: S2E15
    title: "Red Herring"
    synopsis: "A celebrated chef is poisoned in the middle of a cooking competition in Napa Valley."
    details: ""
  - code: S2E16
    title: "Code Red"
    synopsis: "A government researcher is exposed to a deadly virus inside a secured laboratory."
    details: ""
  - code: S2E17
    title: "The Red Box"
    synopsis: "A tutor is found murdered, with a small red box left near the body."
    details: ""
  - code: S2E18
    title: "Aingavite Baa (Red Water)"
    synopsis: "A blood-covered woman with no memory appears in the road in front of the team's car."
    details: ""
  - code: S2E19
    title: "Blood Money"
    synopsis: "A deputy district attorney is found murdered in her home."
    details: ""
  - code: S2E20
    title: "Red All Over"
    synopsis: "A media company CEO is found murdered."
    details: ""
  - code: S2E21
    title: "18-5-4"
    synopsis: "A man is shot dead by a gunman dressed as a clown."
    details: ""
  - code: S2E22
    title: "Red Letter"
    synopsis: "The head of a charity that fights human trafficking is found murdered."
    details: ""
  - code: S2E23
    title: "Red Sky in the Morning"
    synopsis: "The team works a new case."
    details: ""

