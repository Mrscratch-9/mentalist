# Generated by pnpm data:import — do not edit. Spoilers: do not open outside the app.

translations:
  - field: synopsis
    hash: 822710de4982
    key: S1E1
    text: El consultor del BIC Patrick Jane, la Agente Principal Teresa Lisbon y su equipo investigan el doble asesinato en Palm Springs de la esposa de un golfista profesional y su médico, que tiene las características de un asesino en serie con una conexión personal con Patrick Jane.
  - field: title
    hash: 383e2d946278
    key: S1E1
    text: Piloto
  - field: synopsis
    hash: 1fe338bb18fe
    key: S1E10
    text: Cuando un destacado investigador científico es asesinado envenenado, Patrick Jane toma un interés personal en el caso cuando descubre que la principal sospechosa es la esposa de la víctima, quien también fue la antigua psiquiatra de Patrick Jane.
  - field: title
    hash: b477d786cbff
    key: S1E10
    text: Aulas rojas
  - field: synopsis
    hash: b7b8a41461de
    key: S1E11
    text: Atraído por la promesa de un asesino condenado de revelar información sobre Red John a cambio de su liberación, Patrick Jane se enfoca completamente en esa meta y renuncia al BIC para demostrar que el prisionero es inocente.
  - field: title
    hash: a06ff3c3c522
    key: S1E11
    text: Los amigos de Red John
  - field: synopsis
    hash: 8713f17a39bd
    key: S1E12
    text: Patrick Jane prepara una trampa mentalista para descubrir quién es responsable del asesinato de un chico de preparatoria que hostigaba a la autoproclamada bruja local al matar a su gato.
  - field: title
    hash: 0d7f09be33d4
    key: S1E12
    text: Maleficio rojo
  - field: synopsis
    hash: 1dc85c5aca44
    key: S1E13
    text: Aunque parece obvio que el yerno de un magnate de negocios estuvo involucrado en el robo de un cuadro de $50 millones, ya que su cuerpo se encuentra donde una vez colgaba la pintura, Patrick Jane sospecha de otros, incluyendo a un magnate del petróleo ruso, un falsificador de arte y un curador de arte.
  - field: title
    hash: 9fe6c1d31adb
    key: S1E13
    text: Pintado en rojo
  - field: synopsis
    hash: 9220f9184f2a
    key: S1E14
    text: Con la ayuda de Patrick Jane, Cho se infiltra haciéndose pasar por un hombre encantador con todas las tácticas correctas para atrapar a un experto en el arte de la seducción y un asesino con su propio conjunto de técnicas pseudo-mentales.
  - field: title
    hash: a67a9dc888cb
    key: S1E14
    text: Casanova carmesí
  - field: synopsis
    hash: aff4f432a6f5
    key: S1E15
    text: Mientras Patrick Jane y el equipo investigan la muerte por envenenamiento de la "abeja reina" en un club campestre, descubren que la comunidad está llena de secretos, incluyendo amoríos y abuso de drogas.
  - field: title
    hash: 061ad6be1eb3
    key: S1E15
    text: Fiebre escarlata
  - field: synopsis
    hash: b7ca164090b1
    key: S1E16
    text: Patrick Jane debe depender de sus otros sentidos durante la investigación de un asesinato de un asesor financiero cuando pierde la vista como resultado de una explosión.
  - field: title
    hash: d4576e7bd3cb
    key: S1E16
    text: Inyectado en sangre
  - field: synopsis
    hash: 0e5bdd87ad80
    key: S1E17
    text: Una historia de avaricia y traición enfrenta a Patrick Jane contra un grupo de financieros cuando el BIC investiga una serie de asesinatos en una reunión corporativa en las tierras altas de las estribaciones de Sierra Nevada.
  - field: title
    hash: 84e403ccdce0
    key: S1E17
    text: Rojo corporativo
  - field: synopsis
    hash: b805e9c81b1c
    key: S1E18
    text: Un hombre se presenta en las dependencias del FBI con el cadáver de una mujer en un saco. Patrick Jane enseguida se da cuenta de que está hipnotizado, ya que no deja de afirmar que lo que lleva a sus espaldas es un saco de patatas. Cuando investigan la identidad del hombre y de la víctima, los resultados los llevan hasta un centro de hipnosis en el que un equipo de doctores enseña a los alumnos a hipnotizar para conseguir cualquier propósito. Un miembro del equipo de Patrick Jane correrá el peligro de ser hipnotizado e involucrado directamente en el caso.
  - field: title
    hash: e6ef4a2958c8
    key: S1E18
    text: Fécula roja
  - field: synopsis
    hash: d4e5fec198fb
    key: S1E19
    text: Félix Hanson, un ex político recién convertido en productor cinematográfico, aparece muerto en un callejón de Los Ángeles. La víctima, que estaba financiando la nueva película de su esposa, una conocida actriz, había tenido una pelea con el director del filme y le había amenazado con retirar los fondos. Patrick Jane estudiará meticulosamente la vida del productor para descubrir quién podría tener intención de acabar con su vida.
  - field: title
    hash: f979146c4128
    key: S1E19
    text: Una docena de rosas rojas
  - field: synopsis
    hash: 97f40861ad16
    key: S1E2
    text: Mientras Teresa Lisbon y su equipo investigan el asesinato de una joven camarera en el Valle de Napa, Patrick Jane va a espaldas de Teresa Lisbon para orquestar su propia operación encubierta utilizando a Van Pelt como cebo.
  - field: title
    hash: c1cf762ec0bb
    key: S1E2
    text: Pelo rojo y cinta plateada.
  - field: synopsis
    hash: 35988b214a91
    key: S1E20
    text: Ed Didrikson, un testigo protegido que ofreció a la policía información sobre la mafia aparece muerto en las inmediaciones de su pueblo. Su mujer, asustada y decepcionada con el FBI, encargado de protegerles en su nueva vida, asegura que se trata de un ajuste de cuentas por parte de Sonny Battaglia, el jefe de los mafiosos. Sin embargo, hay algo en su declaración que no convence a Patrick Jane, quien decide adentrarse en la organización para descubrir si la mujer dice la verdad.
  - field: title
    hash: a47aaf8c7a66
    key: S1E20
    text: Salsa roja
  - field: synopsis
    hash: 0c9685706e96
    key: S1E21
    text: El consejero delegado y socio fundador de una empresa de software aparece muerto en su yate. El ejecutivo se había divorciado de una mujer muy codiciosa a la que había dado la mitad de su capital hacía un año. Sin embargo, Patrick Jane descubre que podría existir dinero no declarado y escondido en alguna parte, posiblemente en un lugar que solo la novia de la víctima conociera. El caso se complica cuando la identidad de esta mujer es cuestionada por el FBI.
  - field: title
    hash: 98121605e2c5
    key: S1E21
    text: La pantera roja
  - field: synopsis
    hash: c85e01313bca
    key: S1E22
    text: El cadáver de un adolescente es encontrado en un campamento especializado en niños con problemas de actitud. El equipo de Patrick Jane interroga al director del centro y a algunos compañeros de la víctima. Parece que una antigua leyenda sobre un hombre llamado Zacarías tiene atemorizados a los chicos, que se niegan a revelar quién está detrás de la historia. Las sospechas de que el director mantenga una relación sexual con una de las alumnas complican el caso.
  - field: title
    hash: 31a193f3c3d6
    key: S1E22
    text: Hermanos de sangre
  - field: synopsis
    hash: 11a054ab5ca7
    key: S1E23
    text: Red John vuelve a cometer un crimen. Esta vez se trata de una joven de 19 años cuya hermana gemela se encuentra en paradero desconocido. Patrick Jane se toma el caso como algo personal e investiga con máximo cuidado las pruebas y los sospechosos de haber actuado como cómplices del peligroso asesino en serie. Su prioridad será darle caza, aunque ello pudiera costarle su propia vida.
  - field: title
    hash: 1a576ff3fd78
    key: S1E23
    text: Tras la pista de Red John
  - field: synopsis
    hash: 923ba05c11bf
    key: S1E3
    text: Cuando el cuerpo de una chica de preparatoria aparece en la playa, Patrick Jane prepara una trampa mentalista para que sus amigos surfistas se enfrenten entre sí y revelen lo que realmente sucedió.
  - field: title
    hash: 6b1e3511b4df
    key: S1E3
    text: Marea roja
  - field: synopsis
    hash: e557d84b2ff1
    key: S1E4
    text: Cuando el equipo descubre que un rico banquero de inversiones encontrado asesinado dentro de su habitación de seguridad cerrada vivía una doble vida y estaba desviando millones de sus clientes, Patrick Jane crea un enigma mental para ver cuál de los sospechosos mostrará sus verdaderos colores.
  - field: title
    hash: 10ca1b4262f8
    key: S1E4
    text: Damas de rojo
  - field: synopsis
    hash: "645735388811"
    key: S1E5
    text: Cuando encuentran a una chica cubierta de sangre y sosteniendo el arma homicida que mató a su mejor amiga, se convierte en una sospechosa evidente, aunque no puede recordar nada. Pero Patrick Jane, creyendo que es inocente, elabora una maniobra arriesgada en la que ella debe revivir los aterradores eventos para desencadenar su memoria.
  - field: title
    hash: eece40522090
    key: S1E5
    text: Secuoya roja
  - field: synopsis
    hash: d0f156fd3c70
    key: S1E6
    text: Mientras investiga el caso del dueño de un casino asesinado, Patrick Jane utiliza sus habilidades de mentalista para finalmente atrapar al asesino y ganar a lo grande en las mesas de juego.
  - field: title
    hash: 36e8ba7e3282
    key: S1E6
    text: Mano roja
  - field: synopsis
    hash: 2d3b3fa81b3d
    key: S1E7
    text: Patrick Jane se enfrenta cara a cara con un "psíquico" al que sospecha de asesinato. Determinado a demostrar que el supuesto psíquico es un fraude, así como un asesino, Patrick Jane organiza una sesión espiritista para exponer al asesino.
  - field: title
    hash: 2bdc5cc930a8
    key: S1E7
    text: Visión roja
  - field: synopsis
    hash: 24e3ac1e7a9c
    key: S1E8
    text: Mientras la policía sospecha que un narcotraficante en juicio está detrás de los asesinatos del testigo estatal en su caso, así como de su novia, Patrick Jane ve un motivo diferente para el crimen, así como a un sospechoso diferente.
  - field: title
    hash: 15d2f5627427
    key: S1E8
    text: La delgada línea roja
  - field: synopsis
    hash: d2d2f854a534
    key: S1E9
    text: Patrick Jane sospecha que el único miembro sobreviviente de una unidad de la Guardia Nacional es el responsable de asesinar a sus amigos y se infiltra en el caso para demostrarlo.
  - field: title
    hash: 36b8393ecc5b
    key: S1E9
    text: Rojo fuego
  - field: synopsis
    hash: c35f1e64e48b
    key: S2E1
    text: Patrick Jane y la agente Teresa Lisbon reciben la notificación de que no llevarán más el caso de Red John. Patrick Jane no puede asumir que le aparten de un tema tan importante para él y se plantea abandonar el trabajo en la oficina. Sin embargo, lo piensa mejor y decide seguir en el BIC, siempre y cuando Bosco (Terry Kinney, Oz), el agente ahora asignado al peliagudo caso, le filtre toda la información que vaya recopilando. Lo que Patrick Jane no sabe es que Bosco es un hueso duro de roer.
  - field: title
    hash: a5cb3e05865a
    key: S2E1
    text: Redención
  - field: synopsis
    hash: 0b0536e3b4b2
    key: S2E10
    text: El equipo de Teresa Lisbon investiga el asesinato de un antiguo jugador de béisbol que acababa de abrir su propia escuela para entrenar a jóvenes promesas de este deporte. Durante la investigación, una pelota de béisbol golpea a Patrick Jane en la cabeza y éste comienza a sufrir flashbacks que le transportan a su adolescencia, cuando trabajaba como mentalista con su padre, Alex.
  - field: title
    hash: a96e0ea16bac
    key: S2E10
    text: Lanzando fuego
  - field: synopsis
    hash: c27e58f53cf4
    key: S2E11
    text: El BIC investiga un doble homicidio. Un hombre y una mujer aparecen muertos en un coche, en las inmediaciones de una localidad californiana. Patrick Jane, que con un rápido vistazo a la escena descubre que ambos iban a una fiesta, lleva a Teresa Lisbon hasta el instituto más cercano, donde se celebra una reunión de antiguos alumnos. Allí, todos conocen a la víctima, un joven al que recuerdan con cariño pero que manchó su expediente gastándole una broma pesada a otro alumno. El equipo investigará la identidad de la mujer que viajaba con él en busca de pistas.
  - field: title
    hash: b7d98e2ff909
    key: S2E11
    text: De color de rosa
  - field: synopsis
    hash: 223c63985b1a
    key: S2E12
    text: El equipo de Teresa Lisbon da su consentimiento para que un periodista de un conocido canal de televisión grabe su trabajo. En este caso, investigan el asesinato de una joven que trabajaba en el Gabinete de Prensa de un ayuntamiento californiano. La alcaldesa, que no tenía buena relación con la víctima, es considerada sospechosa del suceso. Sin embargo, el terrible secuestro de Patrick Jane por parte de un grupo contrario al gobierno local se convierte en la prioridad para Teresa Lisbon, que pondrá todos los medios para liberarle antes de que sea demasiado tarde.
  - field: title
    hash: 38dd9bfe1a63
    key: S2E12
    text: Corazón sangrante
  - field: synopsis
    hash: 0d5c97990d24
    key: S2E13
    text: Liselle, una atractiva vendedora de coches de lujo es hallada muerta en el maletero de uno de estos vehículos. Patrick Jane y el equipo se trasladan hasta el lugar para investigar lo sucedido. La tensa competencia entre estos vendedores hace que todos los compañeros de la joven se conviertan en sospechosos de asesinato. Patrick Jane, sin embargo, decide centrarse en uno de los clientes de Liselle, un hombre adinerado al que le gustan las emociones fuertes.
  - field: title
    hash: 4cdc68082e02
    key: S2E13
    text: Línea roja
  - field: synopsis
    hash: 12c26ac1d91c
    key: S2E14
    text: Cho recibe una llamada de una agente que le reclama en la escena de un crimen. Cuando llega al lugar para identificar a la víctima, su corazón da un vuelco. Se trata de uno de sus mejores amigos, miembro de la banda callejera a la que pertenecía. Cho se tomará la justicia por su mano y visitará al cabecilla en busca de una explicación. Sin embargo, la banda niega haber tenido algo que ver con el asesinato de la víctima, que acababa de salir de prisión y renegaba de sus antiguos colegas. Solo Patrick Jane podrá poner un poco de tranquilidad en su compañero, sediento de venganza.
  - field: title
    hash: 3afe233e209f
    key: S2E14
    text: Sangre nuestra, sangre ajena
  - field: synopsis
    hash: 8b49ac912491
    key: S2E15
    text: Un chef con gran reputación llamado Jeff muere envenenado durante un concurso de cocineros en el Valle de Napa. Patrick Jane y el equipo de Teresa Lisbon viajan hasta allí para entrevistarse con los testigos y descubren que la víctima acababa de separarse de su mujer. Al parecer, Jeff también tenía una amante que se movía en el mismo círculo que él y que estaba casada. Todos los que competían en el concurso parecían tener un buen motivo para acabar con la vida del cocinero, pero hará falta la agudeza de Patrick Jane para descubrir al culpable.
  - field: title
    hash: 35c251586daa
    key: S2E15
    text: Señuelo rojo
  - field: synopsis
    hash: dc72f9fe9b59
    key: S2E16
    text: Una mujer llama desesperada a Patrick Jane en busca de ayuda. Se trata de una científica que trabaja en un laboratorio de alto riesgo y que va a morir en pocas horas. Alguien de su entorno ha liberado un virus mortal en su despacho, y es deber de Teresa Lisbon y Patrick Jane trasladarse hasta las instalaciones para interrogar a sus compañeros. La víctima reconoce ante los investigadores que tenía un amante, pero su marido, también científico, estaba al tanto de esta relación y la aprobaba.
  - field: title
    hash: aa7a1b56264a
    key: S2E16
    text: Código rojo
  - field: synopsis
    hash: cba3fe12c626
    key: S2E17
    text: Patrick Jane y el equipo del BIC investigan el asesinato de un tutor y encuentran una misteriosa cajita roja cerca del cuerpo, desencadenando una serie de eventos que convierten el asesinato en la búsqueda de un valioso anillo robado del Museo Británico. Mientras tanto, Teresa Lisbon está preocupada cuando una nueva jefa, Madeleine Hightower, asume el mando del BIC y de alguna manera descubre el romance de Rigsby y Van Pelt.
  - field: title
    hash: c4b62fecc854
    key: S2E17
    text: La caja roja
  - field: synopsis
    hash: 33a995eec405
    key: S2E18
    text: Van Pelt y Cho descubren durante una misión a una mujer ensangrentada que padece amnesia. Siguiendo su rastro, el equipo llega hasta un granero donde encuentran tres cadáveres. Una de las víctimas era un joven perteneciente a una reserva turística. Patrick Jane trata de que la mujer amnésica recuerde algo sobre lo que ocurrió y la lleva al lugar de donde provenía el joven. Las reacciones de los habitantes no se hacen esperar. Mientras, Hightower, la nueva supervisora de Teresa Lisbon, se enfrenta al problema que supone la relación de Rigsby y Van Pelt. La pareja deberá tomar una difícil decisión.
  - field: title
    hash: 9c32272495c8
    key: S2E18
    text: Agua roja
  - field: synopsis
    hash: 6b805f80df2e
    key: S2E19
    text: Kelly Flower, ayudante del fiscal, aparece asesinada por un disparo a bocajarro. Patrick Jane descubre al responsable, un asesino a sueldo que ha cambiado de identidad en multitud de ocasiones. Sin embargo, la experimentada abogada del acusado consigue que rechacen las pruebas debido a un tremendo error de Patrick Jane. La falta provoca la suspensión de Teresa Lisbon por un periodo de 5 días, por lo que el equipo deberá hacer frente al caso con Cho al mando.
  - field: title
    hash: 7551ce962903
    key: S2E19
    text: Dinero de sangre
  - field: synopsis
    hash: 246c9012be32
    key: S2E2
    text: La violenta muerte de Kristin Marley, ayudante de una senadora, hace levantar las sospechas sobre la relación que la víctima mantenía con el esposo de su superiora. Patrick Jane descubre que el matrimonio de la senadora estaba terminado, pero no encuentran ninguna prueba que pueda incriminarles porque ambos tienen una coartada. Será la aparición del hermanastro de Kristin lo que ponga al equipo en alerta. Mientras, Bosco continúa escondiendo secretos sobre el caso de Red John, algo que no gusta a Patrick Jane.
  - field: title
    hash: f3deab3e759e
    key: S2E2
    text: La letra escarlata
  - field: synopsis
    hash: c6f4c04c792c
    key: S2E20
    text: Xander Harrington, el recién nombrado consejero delegado de una empresa de medios, es asesinado durante una fiesta en su honor. Su mujer, también empleada en la empresa, es designada a ocupar su puesto, lo que no sienta muy bien a algunos miembros de la familia. El caso se complica aún más cuando la investigación lleva a Patrick Jane al Centro de Visualización, una secta de la que la asistente de la familia es parte activa. El artífice del grupo se convertirá en un peligroso contrincante para Patrick Jane, que lo colocará en el segundo puesto de su lista negra.
  - field: title
    hash: 8487becc8cb3
    key: S2E20
    text: Rojo por los cuatro costados
  - field: synopsis
    hash: e19fed894394
    key: S2E21
    text: Un genio de las Matemáticas que padecía fobia a los payasos es asesinado en un parque por uno de ellos. La víctima había accedido a formar parte de un proyecto que podría suponer un gran peligro para la seguridad en Internet. Varias personas conocían su trabajo, pero solo una de ellas sería capaz de matar por ello. Patrick Jane y Teresa Lisbon tendrán que trabajar con el resto del equipo para descubrir de quién se trata.
  - field: title
    hash: e6359417ba61
    key: S2E21
    text: 21-18-11-18
  - field: synopsis
    hash: 89a75cbce8b6
    key: S2E22
    text: Héctor Brava, el jefe de una organización contra el tráfico de seres humanos, es asesinado pocos minutos antes de dar un importante discurso. El BIC es llamado a investigar el crimen y la policía local pide ayuda a Kristina Frye (Leslie Hope), una psíquica con la que Patrick Jane ya había tenido algún acercamiento. La esposa de la víctima parece guardar algún secreto, sin embargo, será un descubrimiento algo escabroso sobre la vida personal de Héctor lo que lleve a Kristina Frye y a Patrick Jane a trabajar juntos para destapar al culpable. El acercamiento entre ambos podría traspasar la barrera profesional.
  - field: title
    hash: fb4e6fdae287
    key: S2E22
    text: Carta roja
  - field: synopsis
    hash: 32265fa1316b
    key: S2E23
    text: Cuando Patrick Jane empezaba a superar la muerte de su esposa e hija y le había dado una oportunidad a Kristina Frye (Leslie Hope), la psíquica y colaboradora esporádica del BIC, Red John regresa para volver a matar. El asesinato de una joven estudiante lleva al consultor y al equipo de Teresa Lisbon hasta el escenario del crimen, donde todo indica que el asesino en serie podría ser el autor del homicidio. Sin embargo, Patrick Jane no está convencido de ello y decide interrogar a algunos sospechosos. Kristina Frye, que se ofrece a colaborar en el caso a pesar de la negativa de Patrick Jane, cometerá un error que tendrá terribles consecuencias. La psíquica despertará la ira de Red John, y Patrick Jane se sentirá en el deber de protegerla.
  - field: title
    hash: c7dbc780d4f6
    key: S2E23
    text: Cielo rojo al amanecer
  - field: synopsis
    hash: b2b14e0bfc9f
    key: S2E3
    text: El BIC recibe un anónimo alertando sobre un cadáver en un callejón. Cuando llegan a la escena, Teresa Lisbon identifica a la víctima como un pederasta al que detuvo años atrás. La investigación avanza hacia un camino inesperado al descubrir que la única huella encontrada como prueba y rastro del asesino es de la propia Teresa Lisbon. El equipo se vuelca en la defensa de su jefa mientras Bosco pone trabas a su investigación.
  - field: title
    hash: 2a8d8abf8a82
    key: S2E3
    text: Placa roja
  - field: synopsis
    hash: aecbb301d94c
    key: S2E4
    text: La muerte de un abogado que defendía a una peligrosa banda de moteros introduce al equipo de Teresa Lisbon en un ambiente de drogas y mentiras. Nadie se salva de ser sospechoso del crimen. El jefe de la banda, la esposa de la víctima o la hermana de un hombre inocente encarcelado por una exitosa acusación, todos ellos tenían alguna razón para querer acabar con el letrado. La astucia de Patrick Jane será imprescindible para descubrir al culpable.
  - field: title
    hash: d7dc1dd7fc55
    key: S2E4
    text: Amenaza roja
  - field: synopsis
    hash: 87641d05ab77
    key: S2E5
    text: El equipo de Patrick Jane acude a la mansión de los Beckworth, donde se ha encontrado el cuerpo sin vida de un artista que acababa de comprar la casa. El sheriff, que afirma que no han forzado ninguna puerta ni ventana, les habla de la existencia del fantasma de un antepasado de los Beckworth, que lleva años rondando el lugar. Este rumor lleva a los investigadores a plantearse la existencia de espíritus, algo que Patrick Jane se encargará de descubrir. Entretanto, Rigsby se arma de valor y le dice a Van Pelt lo que siente por ella.
  - field: title
    hash: 57a22e2b7cef
    key: S2E5
    text: Miedo rojo
  - field: synopsis
    hash: 13a29299c571
    key: S2E6
    text: Bosco descubre el micrófono oculto que Jane había instalado en su despacho y le da a elegir entre dejar el BIC o ingresar en prisión. Lejos de dimitir y dejar su trabajo, Patrick Jane decide experimentar cómo se vive entre rejas. Su ausencia es muy sentida por el equipo, que atraviesa ciertos problemas para resolver un crimen cometido en un pueblo. Sin embargo, Patrick Jane tiene otros asuntos que solucionar mucho más importantes y que conciernen a los peligrosos reclusos.
  - field: title
    hash: bd34c09a546e
    key: S2E6
    text: Oro negro, sangre roja
  - field: synopsis
    hash: 0042a0d0b81b
    key: S2E7
    text: El jefe del BIC pone al equipo de Teresa Lisbon a trabajar con el de Bosco para limar asperezas. Ambos se enfrentan al secuestro de Mia, la heredera de un magnate del petróleo. El caso parecer guardar relación con otro ocurrido hace años que se saldó con la vida del secuestrado. Patrick Jane quiere evitar que este secuestro termine como el de años atrás, pero Bosco tratará por todos los medios de que sus ideas nunca se lleven a cabo.
  - field: title
    hash: f51156b616ac
    key: S2E7
    text: Toros rojos
  - field: synopsis
    hash: 31beec3dbad9
    key: S2E8
    text: Bosco y su equipo son atacados en su propia oficina. Dos agentes mueren y otro se encuentra en paradero desconocido. Bosco, por su parte, es trasladado al hospital, pero los médicos se muestran poco optimistas. Minelli asigna el caso a Teresa Lisbon que, con la ayuda de Patrick Jane, descubre el cadáver del agente desaparecido. Todo indica que Red John es el responsable de la terrible matanza en el BIC, y sus agentes no descansarán hasta descubrir quién ha sido su cómplice en el edificio.
  - field: title
    hash: e5c8cc9d0a56
    key: S2E8
    text: Secretaria roja
  - field: synopsis
    hash: 458f262f1415
    key: S2E9
    text: Patrick Jane y Teresa Lisbon investigan el ataque a un reputado joyero en su propio establecimiento. La esposa de la víctima y sus dos sobrinos no se muestran dispuestos a colaborar con Patrick Jane, que sospecha que alguien de la familia ha tenido algo que ver. El caso empeora cuando el principal sospechoso aparece muerto en su habitación de hotel.
  - field: title
    hash: 1b1342ea3f39
    key: S2E9
    text: Más valioso que un rubí
  - field: synopsis
    hash: 9abf0b07997d
    key: S3E1
    text: Después del secuestro de Kristina Frye, Patrick Jane pretende tomarse un tiempo antes de volver al trabajo. Por el contrario, el nuevo jefe tiene mucho interés en que trabaje en el último caso en el que estaba. Se trata del asesinato en plena calle de Dublin, un abogado de prestigio. Teresa Lisbon tendrá que utilizar métodos poco éticos para traer de vuelta a su mejor asesor.
  - field: title
    hash: edf6c5ecabfb
    key: S3E1
    text: Cielo rojo al anochecer
  - field: synopsis
    hash: 62abf423e923
    key: S3E10
    text: Un hombre disfrazado de Santa Claus cae desde una ventana y muere en el acto. Los investigadores lo consideran un suicidio debido a una nota encontrada en su bolsillo, pero Patrick Jane está seguro de que se trata de un asesinato. El equipo de Teresa Lisbon descubre que la víctima pertenecía a Alcohólicos Anónimos y formaba parte de la Sociedad Nacional de Auténticos Santa Claus. Los agentes buscan sospechosos entre los miembros de estas asociaciones tan dispares. Durante esta investigación, un detective independiente interroga a Patrick Jane sobre la repentina muerte del sospechoso del último caso en el que trabajaron.
  - field: title
    hash: 57673b50c8a2
    key: S3E10
    text: Duendecillo rojo
  - field: synopsis
    hash: 5e4117c64ac9
    key: S3E11
    text: Charlotte Mitchell, una periodista que estaba escribiendo un libro acerca de los pesos medios Rowdy Merriman y Manny Flaco, es asesinada en el backstage durante la pelea que enfrentaba a los dos luchadores. Ninguna de las personas relacionadas con la lucha ofrece pistas sobre lo que pudo ocurrir, pero todos tenían algún motivo para matar a la escritora. Mientras investigan este caso, el detective LaRoche prosigue sus interrogatorios sobre la muerte de Todd Johnson en las dependencias del BIC. Rigsby será su siguiente sospechoso.
  - field: title
    hash: af55e7221c5f
    key: S3E11
    text: Combate sangriento
  - field: synopsis
    hash: 5d9d50fd8c24
    key: S3E12
    text: Patrick Jane, Teresa Lisbon y el resto del equipo acuden a las instalaciones de un desguace de vehículos por el hallazgo de dos cadáveres de mujer. Ambas fueron asesinadas en otro lugar y después trasladadas hasta allí. La doctora Montague del FBI (Linda Park), una asesora especialista en un programa que predice la autoría de los crímenes trabajará con el BIC y asegurará que los asesinatos son obra de "El cavernícola", un conocido asesino en serie que hacía algunos años había dejado de actuar. Las diferencias en los métodos de investigación de Patrick Jane y la asesora darán lugar a situaciones comprometidas.
  - field: title
    hash: 2c757d1e8cef
    key: S3E12
    text: Sabuesos rojos
  - field: synopsis
    hash: 89075c37c954
    key: S3E13
    text: La directora de documentales Amber Sutherland es asesinada a tiros en la localidad californiana de Crane Creek cuando realizaba un reportaje para la campaña electoral del alcalde Kenyon Bagshaw. El director del BIC, amigo íntimo de la esposa del político, telefonea a Teresa Lisbon para asegurarse de que su equipo realiza la investigación con la mayor diligencia. La periodista también rodaba un documental sobre Ron Crosswhite, un hombre al que el pueblo responsabiliza de la muerte de su esposa años atrás. Un ataque de furia de este sospechoso le hará retener en el ayuntamiento a un gran número de gente, entre la que se encuentran Patrick Jane y la mujer del alcalde. El mentalista tendrá que hacer uso de su rapidez mental para resolver el conflicto de manera segura.
  - field: title
    hash: dc2865e47ac8
    key: S3E13
    text: Alerta roja
  - field: synopsis
    hash: 553ce4518055
    key: S3E14
    text: Van Pelt es designada para proteger a un hombre que está a punto de testificar en un juicio. La agente se desplaza hasta la casa del testigo, que se encuentra allí con su hija. Durante una ronda en el jardín, alguien irrumpe en la vivienda y le dispara, dejando a su pequeña en shock y amnésica. La actuación de Van Pelt al frente de la seguridad de la víctima es puesta en duda por el inspector LaRoche, que tratará de chantajearla.
  - field: title
    hash: b833b1665315
    key: S3E14
    text: Sangre por sangre
  - field: synopsis
    hash: d1a631545c51
    key: S3E15
    text: Un buscador de oro actual es encontrado muerto cerca de una mina. Teresa Lisbon se lesiona durante el comienzo de la investigación, por lo que el agente Hightower se ve obligado a colaborar con Patrick Jane por primera vez.
  - field: title
    hash: 2393b4f2f5fc
    key: S3E15
    text: Oro rojo
  - field: synopsis
    hash: add7e791c1e5
    key: S3E16
    text: El equipo del BIC acude al Museo de Arqueología y Antropología de Northern California, donde sus guardias han hallado muerto a Manuel Montero, profesor de arqueología y marchante de antigüedades. La desaparición de una valiosa figura antigua de oro y el negocio de Montero, cuyo origen es más que dudoso, darán lugar a una exhaustiva investigación que terminará por incriminar a la agente Hightower, a la que también se relaciona con el crimen de Todd Johnson. Tomando como escudo a Patrick Jane, la agente Hightower intentará escapar del edificio del BIC.
  - field: title
    hash: 6b05ab36f06a
    key: S3E16
    text: Reina roja
  - field: synopsis
    hash: c06018d61426
    key: S3E17
    text: Patrick Jane y el equipo investigan el asesinato de un médico hallado muerto en un campo de golf. Los agentes interrogan a los sospechosos, entre los que se encuentran tanto el personal del hospital donde trabajaba la víctima como los enfermos. Después de lo ocurrido con Hightower, el detective LaRoche asume el liderazgo del BIC y nombra a Cho jefe del equipo, relegando a Teresa Lisbon a su subordinada.
  - field: title
    hash: ae919846975f
    key: S3E17
    text: Torrente sanguíneo
  - field: synopsis
    hash: deb280299685
    key: S3E18
    text: Un hombre que afirmaba haber sido abducido por alienígenas aparece muerto en mitad de un descampado. Su cuerpo, transportado por el juez de instrucción Steiner, es robado durante el trayecto al instituto forense. Patrick Jane y Teresa Lisbon rastrean a los ladrones y visitan la casa de la víctima, donde se entrevistan con Elspeth Cook (Frances Conroy, 'A dos metros bajo tierra'), la aristócrata suegra del desaparecido. El consultor del BIC, consciente de que Steiner guarda un triste secreto, le invita a acompañarles en la investigación del caso.
  - field: title
    hash: 80d720458641
    key: S3E18
    text: La milla roja
  - field: synopsis
    hash: d0b4998b00b8
    key: S3E19
    text: John Flinn, el dueño de una exclusiva web de citas aparece muerto en el Puerto Deportivo de South Beach (San Francisco) y Patrick Jane está seguro de que la asesina de Flinn es su mujer, Erica (Morena Baccarin). Sin embargo, cuando el BIC tiene que descartar la autoría de la esposa por falta de pruebas, la investigación de Patrick Jane llega a un punto muerto. Después de explorar el mundo de los servicios de citas de alto standing, el equipo descubre que al menos una de las mujeres ha grabado en vídeo sus encuentros con hombres ricos para chantajearles después. Mientras el equipo investiga esto, Patrick Jane no puede olvidarse de sus sospechas iniciales sobre Erica. Así que, cuando la coartada de la esposa comienza a desmontarse, Patrick Jane se da cuenta de que el asistente de Erica, Peter, es la clave.
  - field: title
    hash: 938aeaa0e8ac
    key: S3E19
    text: Todas las rosas tienen espinas
  - field: synopsis
    hash: 8f538d009830
    key: S3E2
    text: Patrick Jane es sorprendido por una llamada de Danny, el hermano de su esposa. Su cuñado se ha visto envuelto en un asesinato y le pide ayuda para escapar de la Policía. La víctima es Lester Wale, un hombre de negocios que había sido objeto de una estafa. Patrick Jane, afectado por el regreso de Danny, retomará sus antiguas amistades feriantes para recabar información sobre el crimen. Este acercamiento le hará recordar lo que ocurrió con su esposa e hija y le empujará a abrir su corazón y confesar que se siente culpable por su muerte.
  - field: title
    hash: 457780ac856d
    key: S3E2
    text: Sangre falsa
  - field: synopsis
    hash: 2aac167c7e33
    key: S3E20
    text: "Patrick Jane debe investigar dos intentos de robo fallidos: uno terminó con el asesinato del dueño de un taller de reparación y en el otro está involucrado Donny Culpepper (estrella invitada David Warshofsky), un sospechoso habitual contratado personalmente por Patrick Jane para entrar en la casa de LaRoche."
  - field: title
    hash: 25b296232b73
    key: S3E20
    text: Tachado en rojo
  - field: synopsis
    hash: 70653725de96
    key: S3E21
    text: Tras la muerte de un guarda de prisiones, Patrick Jane y su equipo se ponen a investigar el caso al sospechar que el autor del asesinato puede ser un ex convicto que vive en la zona. Patrick Jane se reúne con cada uno de los posibles asesinos para intentar dar con el autor material de los hechos, algo que resultará muy complicado por las pocas pistas que tienen y la gran cantidad de sospechosos que hay.
  - field: title
    hash: 0f834ab335b0
    key: S3E21
    text: Sangre bastarda
  - field: synopsis
    hash: c5c63dca87a3
    key: S3E22
    text: El BIC encuentra muerta a una violinista profesional en uno de los peores barrios de la ciudad de Sacramento. Con la esperanza de encontrar al asesino, Patrick Jane se infiltra en el mundo de la música profesional, mientras que Cho y Teresa Lisbon se encargarán de encontrar una vinculación entre el novio de la víctima y el Hampa.
  - field: title
    hash: 700af051967d
    key: S3E22
    text: Rapsodia en rojo
  - field: synopsis
    hash: 188a12cc4056
    key: S3E23
    text: El BIC tiene como misión esclarecer lo sucedido en el atentado suicida de un ladrón de bancos en una gasolinera de las afueras. Patrick Jane descubre que el delito cometido va mucho más allá de lo que todos creen, algo que llevará a conseguir revelar la identidad del topo que tiene el BIC.
  - field: title
    hash: 1d35a42ee0df
    key: S3E23
    text: Fresas con nata (Parte 1)
  - field: synopsis
    hash: 4cb4a48bca61
    key: S3E24
    text: Después de que se descubra el nombre del topo de Red John dentro del BIC, Patrick Jane se acerca al asesino en serie hasta el punto de protagonizar con él un tenso cara a cara que se resolverá de forma impactante.
  - field: title
    hash: 1d35a42ee0df
    key: S3E24
    text: Fresas con nata (Parte 2)
  - field: synopsis
    hash: 0c95c1205380
    key: S3E3
    text: Kristina Frye, la mujer a la que Red John secuestró interviene en un programa de radio sobre psíquicos. La Policía rastrea la llamada, pero al llegar al lugar, solo encuentran una muñeca y una cara sonriente teñida de sangre de la secuestrada, sello de identidad del criminal. Patrick Jane investiga paralelamente el asesinato de Celia Jovanovich, un miembro de Visualize, la secta liderada por Bret Stiles (Malcom McDowell, La naranja mecánica), un antiguo conocido de Red John y enemigo de Patrick Jane. El consultor del BIC acude a la sede para hablar con él sobre Celia, pero Bret prefiere dar pistas sobre el imparable asesino. El equipo tendrá que trabajar a fondo para descubrir qué se esconde detrás de esta muerte al tiempo que se empeña en localizar a Kristina Frye con vida.
  - field: title
    hash: ca893335cbe6
    key: S3E3
    text: Con sangre en las manos
  - field: synopsis
    hash: 2eccaa00f97a
    key: S3E4
    text: Patrick Jane y el BIC son llamados a investigar el brutal asesinato de un hombre que acababa de ser puesto en libertad después de cumplir 9 años de condena por violar y matar a una mujer. El convicto había salido de la cárcel debido a una revisión de las pruebas presentadas en el juicio, ya que su ADN no coincidía con el hallado en la escena del crimen. A pesar de tener coartada, el esposo de la mujer violada se coloca en el punto de mira del equipo. Durante la investigación, Patrick Jane tendrá que lidiar con una periodista muy impertinente que se pondrá en su camino.
  - field: title
    hash: 449677ad176a
    key: S3E4
    text: Alfombra roja
  - field: synopsis
    hash: e82a1b31c90f
    key: S3E5
    text: La aparición del cadáver de un jinete llamado William Sutton lleva al equipo hasta Contra Mesa para investigar. El hombre llevaba consigo en el momento de su muerte una nota que decía "lo siento" y un anillo de diamantes. La destinataria de tal regalo era Delinda, la ex novia de William, que había roto con él poco antes del suceso. Patrick Jane, que confía en la inocencia de la joven, indaga en las rencillas entre Cob Holwell y Frank Lockhart, los dueños de los caballos que se preparaban para competir en la próxima carrera.
  - field: title
    hash: f23acead6c1a
    key: S3E5
    text: Caballos rojos
  - field: synopsis
    hash: 6d125513e2d9
    key: S3E6
    text: Patrick Jane y el equipo se trasladan hasta la residencia de una importante jueza que acaba de perder a su anciana madre. Durante el velatorio, la hija de la magistrada descubre que alguien ha matado a su cuñado y su hermana se encuentra en paradero desconocido. La presión que supone para el BIC trabajar en un caso así no detiene a Patrick Jane, que no dudará en poner en práctica sus trucos más descarados para averiguar qué ocurrió realmente en la mansión de máxima seguridad.
  - field: title
    hash: 4acdf28506d2
    key: S3E6
    text: Chanel rosa
  - field: synopsis
    hash: 51ffbc8e3115
    key: S3E7
    text: Walter Mashburn, un viejo conocido del equipo del BIC vuelve a aparecer en sus vidas a raíz de la muerte de Yuri Bajoran, un hombre al que Walter pretendía comprar su empresa. Ambos magnates se conocían desde hacía años, pero su relación no era buena. El primero tuvo que ver cómo su prometida le abandonaba por Yuri, del que juró que se vengaría. Patrick Jane vigila de cerca los movimientos de Marie, la viuda de Yuri, mientras Teresa Lisbon se toma este caso de una manera especial, ya que se siente atraída por Walter y no quiere creer que sea el responsable del crimen.
  - field: title
    hash: 2cfbfc0b6d05
    key: S3E7
    text: Al rojo vivo
  - field: synopsis
    hash: 41b379355e10
    key: S3E8
    text: Patrick Jane es secuestrado. Su captor, un hombre joven y corpulento, le traslada al sótano de una vivienda alejada de la ciudad. Cuando Teresa Lisbon recibe la llamada de Patrick Jane pidiendo ayuda, pone a trabajar al equipo de inmediato. Debido a las características del suceso, el FBI también se verá involucrado. Todos los agentes estudian cada uno de los casos en los que el asesor ha trabajado para descubrir alguna pista sobre la autoría del secuestro. Teresa Lisbon se dará cuenta de que es una tarea muy complicada ya que el mentalista ha dejado muchos enemigos a su paso. Red John podría ser uno de ellos.
  - field: title
    hash: 04d8df51b0b8
    key: S3E8
    text: Bola de fuego
  - field: synopsis
    hash: e9055d9763f3
    key: S3E9
    text: El BIC trabaja en un triple homicidio. Dos de las víctimas eran policías y habían acudido a la llamada de Keeley, una joven que también ha aparecido muerta. Mientras el capitán de emergencias llora la pérdida de su prometida y jura venganza, Patrick Jane le aconseja esperar al momento adecuado. Teresa Lisbon, por su parte, estudia los últimos movimientos de Keeley e interroga a las personas que tuvieron contacto con ella antes de morir. Un astrólogo de los alrededores podría saber más del suceso de lo que piensan las autoridades.
  - field: title
    hash: a908a97f3725
    key: S3E9
    text: Luna roja
  - field: synopsis
    hash: b4380d9dcfc2
    key: S4E1
    text: La nueva temporada comienza unos minutos después de que Patrick Jane dispare a Red John en medio de un concurrido centro comercial. Un hecho que lleva a Patrick Jane directo a la sala de interrogatorios. A pesar de poder enfrentarse a la cárcel, Patrick Jane se muestra calmado y sereno; después de todo, ha acabado por fin con la vida de su principal enemigo. Pero las pruebas no consiguen demostrar que el hombre a quien disparó sea el auténtico Red John. El móvil con el que el asesino habló con O'Laughlin y la pistola que utilizó para amenazar a Patrick Jane han desaparecido de la escena del crimen. Además, el supuesto Red John resulta ser un respetado hombre de negocios con muchas influencias. Finalmente, Pratrick Jane acaba entre rejas. Con todo el equipo del BIC suspendido por sus acciones, Patrick Jane debe encontrar una manera de salir de la cárcel y demostrar que el hombre al que disparó era el verdadero Red John.
  - field: title
    hash: e7ff53ad82e5
    key: S4E1
    text: Cintas rojas
  - field: synopsis
    hash: 91e375cc1c79
    key: S4E10
    text: Durante la búsqueda del asesino de un bombero, Patrick Jane es atacado e intentan ahogarlo. Este accidente provoca que Patrick Jane pierda la memoria temporalmente y que vuelva a ser el Patrick Jane que era antes de formar parte del BIC, un hombre engañoso que hacía creer a todos que tenía más habilidades de las reales.
  - field: title
    hash: 633a40d1c5ae
    key: S4E10
    text: Fuga en rojo
  - field: synopsis
    hash: 828bcd14ded5
    key: S4E11
    text: Tanto Patrick Jane como el BIC deberán investigar una larga lista de sospechosos después de que un abogado especializado en casos de divorcios de personas con un alto poder adquisitivo, con numerosos enemigos, sea asesinado en su lancha. Al mismo tiempo, Patrick Jane es interrogado por el FBI sobre la reaparición de Red John. Igualmente, Patrick Jane se cuestionará si Red John fue el responsable del asesinato de Panzer.
  - field: title
    hash: 7e25254a8b3a
    key: S4E11
    text: Apuesta siempre al rojo
  - field: synopsis
    hash: ab4fd89daad1
    key: S4E12
    text: Con muy pocas pruebas, Patrick Jane y el BIC se encargan de investigar la muerte del hijo de un poderoso jefe de una mafia. Mientras recoge a un testigo para ser interrogado posteriormente, Grace Van Pelt se ve asaltada por los recuerdos. La agente se verá inmersa en una persecución tras un tiroteo, que concluirá con una sorprendente aparición.
  - field: title
    hash: 80569e8e7f24
    key: S4E12
    text: Mi San Valentín sangriento
  - field: synopsis
    hash: ce06dab3b803
    key: S4E13
    text: Un diseñador de moda sin éxito es asesinado justo antes de su gran regreso al mundo de la moda. Mientras tanto, la agente Darcy continúa en la sospecha de que Patrick Jane no asesino a Red John.
  - field: title
    hash: 7df802a4e10a
    key: S4E13
    text: El rojo es el nuevo negro
  - field: synopsis
    hash: 10109a233ccd
    key: S4E14
    text: Mientras un jurado delibera la culpabilidad o inocencia de una acusada de asesinato, Patrick Jane intenta probar, antes de que se agote el tiempo, que la chica ha sido acusada injustamente. Mientras tanto, Summer quizá tenga que irse muy lejos debido a la ayuda que presta a Kimball Cho en un caso contra un sospechoso.
  - field: title
    hash: 9b936997b24c
    key: S4E14
    text: Al primer rubor
  - field: synopsis
    hash: 3ca159636f0d
    key: S4E15
    text: Cuando un trabajador social es asesinado, Erica Flynn, la seductora asesina a la que Patrick Jane metió en prisión tiempo atrás, llama a Patrick Jane para ofrecerle información acerca del caso. Mientras tanto, Rigsby y Sarah intentan adaptarse a su inminente paternidad.
  - field: title
    hash: "843040350421"
    key: S4E15
    text: La guerra de las rosas
  - field: synopsis
    hash: 098c731e97e1
    key: S4E16
    text: El joven jefe de una organización anti-sectas aparece asesinado, el equipo del BIC junto a Patrick Jane, empiezan a investigar y parece que el principal sospechoso es Bret Stiles, el líder de la secta en cuestión y un antiguo enemigo de Patrick Jane.
  - field: title
    hash: 32cab5f30061
    key: S4E16
    text: Una nube roja
  - field: synopsis
    hash: 40dc83969c21
    key: S4E17
    text: Mientras el BIC trata de resolver el asesinato de una joven que fue asesinada después de encontrarse con alguien en una sala de chat en línea, la agente del FBI Susan Darcy le pide ayuda a Patrick Jane con su investigación de homicidio. Su motivo real es descubrir más sobre la relación de Patrick Jane con Red John.
  - field: title
    hash: 8fac9577dd32
    key: S4E17
    text: Burdeos barato
  - field: synopsis
    hash: 71332b6c1d82
    key: S4E18
    text: Patrick Jane y el equipo del BIC intentan reducir la lista de sospechosos del asesinato de un vendedor rico con cáncer terminal. Mientras tanto, Cho se verá obligado a enfrentarse a sus peores demonios.
  - field: title
    hash: 75ef5b94cc30
    key: S4E18
    text: Mejillas sonrojadas
  - field: synopsis
    hash: f726cbf96de9
    key: S4E19
    text: Mientras investiga el asesinato del empleado de un casino, Patrick Jane se encuentra con un mago con el que solía trabajar en su etapa de "mentalista", pero su sorpresa es enorme cuando descubre que este esconde un gran secreto.
  - field: title
    hash: 92c7276028a7
    key: S4E19
    text: Champán rosado con hielo
  - field: synopsis
    hash: da4d21b90856
    key: S4E2
    text: Con Teresa Lisbon suspendida y el resto del equipo reasignado, Patrick Jane se reincorpora como consultor del BIC, obligado a trabajar con un nuevo equipo. Durante la investigación sobre la muerte de un entrenador personal, Patrick Jane conspira para reunir a su antiguo equipo.
  - field: title
    hash: fc57ac6482d5
    key: S4E2
    text: El pequeño libro rojo
  - field: synopsis
    hash: 454922cd96be
    key: S4E20
    text: Patrick Jane y el BIC tratan de averiguar quién tendría motivos para matar a un popular profesor de inglés. Mientras tanto, Cho y Summer ocultan su relación a Teresa Lisbon. Rigsby, por su parte, espera nervioso algo muy especial.
  - field: title
    hash: c6b0856804a5
    key: S4E20
    text: Algo huele a podrido en Redmund
  - field: synopsis
    hash: e084398c5cf3
    key: S4E21
    text: El asesinato de un drag es el nuevo caso que tienen que resolver Patrick Jane y el BIC. Juntos tratan de encontrar su asesino, encuentran el cuerpo quemado de un joven fuera del cabaret donde este realizaba sus actuaciones como drag. Durante la investigación, descubren una lista de sospechosos y todos ellos intimidaron a la víctima.
  - field: title
    hash: 320cf2c5ffec
    key: S4E21
    text: Zapatitos de rubí
  - field: synopsis
    hash: d47820516238
    key: S4E22
    text: Tras 10 años sin verse, Teresa Lisbon se reencuentra con su ex novio Greg Tayback (Kenny Johnson), mientras investiga el asesinato de una persona que practica surf. Al mismo tiempo, a Cho le surgen ciertas dudas sobre su relación con Summer.
  - field: title
    hash: cc7efb4c860f
    key: S4E22
    text: Adiós y gracias por todos los salmonetes
  - field: synopsis
    hash: 1d1d7698b5ce
    key: S4E23
    text: En el octavo aniversario de la muerte de su esposa y su hija, Patrick Jane recibe un mensaje de Red John. Esto provoca que Patrick Jane pierda la concentración en su actual caso, además de poner en peligro la investigación y su carrera en el BIC.
  - field: title
    hash: 53717d3725ba
    key: S4E23
    text: 1, 2, 3, al escondite rojo inglés
  - field: synopsis
    hash: 37e79c0210dc
    key: S4E24
    text: Después de otro intento fallido por atrapar a Red John, Patrick Jane toca fondo en un bar de Las Vegas en el final de la cuarta temporada. Mientras el BIC investiga el asesinato de John Doe por su propia cuenta, además, Patrick Jane encuentra un nuevo amor.
  - field: title
    hash: cc5f38b8abd2
    key: S4E24
    text: El sombrero carmesí
  - field: synopsis
    hash: cd67d5f35914
    key: S4E3
    text: Un niño de nueve años es secuestrado cuando esperaba al autobús para ir al colegio. Su madre, Beth, pedirá ayuda a Patrick Jane para localizarle. Se trata de una antigua cliente del asesor del BIC a la que Patrick Jane debe un favor. El problema vendrá cuando Patrick Jane se encuentre frente a frente con Nate Glass, un "consejero espiritual", una especie de vidente que también está asesorando a Beth en su búsqueda. El equipo del BIC trabajará a contrarreloj y las posibilidades se irán agotando a medida que pasan las horas.
  - field: title
    hash: 1faf42088012
    key: S4E3
    text: Bonito globo rojo
  - field: synopsis
    hash: edb9fa13415a
    key: S4E4
    text: "Durante un mitin político, Patrick Jane avisa de la presencia de un hombre sospechoso que lleva una pistola. El asesor del BIC tiene la certeza de que se trata de un psicópata a punto de cometer un asesinato y tratará de convencer al resto del equipo. Al mismo tiempo, Teresa Lisbon está investigando la muerte de un fotógrafo en el mismo mitin. En el BIC todo cambia con la llegada de un nuevo jefe: el joven Luther Wainwright."
  - field: title
    hash: cab524a0484c
    key: S4E4
    text: Rojo de Texas
  - field: synopsis
    hash: e8f1ce9a010d
    key: S4E5
    text: Patrick Jane y el equipo del BIC investigan el asesinato de una mujer cuyo cuerpo fue arrastrado a una isla en la costa de California. Sin embargo, no es un paraíso para el equipo, ya que buscan al asesino entre un grupo de isleños extraños. Mientras tanto, a Rigsby le preocupa que su relación con un abogado de oficio pueda crear incomodidades entre él y Van Pelt.
  - field: title
    hash: fa7c8c0a589e
    key: S4E5
    text: Sangre y arena
  - field: synopsis
    hash: bfd87a8fc324
    key: S4E6
    text: Cuando el equipo del BIC viaja a un pueblo costero para investigar el asesinato de una jefe de policía, Teresa Lisbon se cruza con su hermano Tommy. El encuentro resulta algo más tenso de lo habitual, ahora Tommy es cazador de recompensas y está buscando a un fugitivo, algo que a su hermana mayor no le gusta demasiado.
  - field: title
    hash: 74b8509a556c
    key: S4E6
    text: ¿Dónde está Carmine O'Brien?
  - field: synopsis
    hash: 8d47c93d4752
    key: S4E7
    text: Cuando el BIC es llamado para ayudar a la policía de San Francisco en una investigación por homicidio, Patrick Jane y su equipo se topan con la búsqueda de un asesino en serie en un caso que tocará muy de cerca al asesor del BIC. Su sospecha inicial parece correcta. Se trata de un hombre de aspecto inocente, sin una coartada concreta y que se niega a cooperar con la policía. Patrick Jane, sin embargo, cree que han detenido al tipo equivocado. Con la ayuda de un blogger, comienza a explorar a otros sospechosos alternativos.
  - field: title
    hash: 178d7c9bd6de
    key: S4E7
    text: Luz roja intermitente
  - field: synopsis
    hash: cf9b59005f46
    key: S4E8
    text: El BIC intenta descubrir quién mató a un agente antidrogas infiltrado que fue asesinado en un callejón fuera de un club nocturno donde estaba investigando a un traficante de drogas.
  - field: title
    hash: 3dadb59ed359
    key: S4E8
    text: Mechas rosas
  - field: synopsis
    hash: d5f57768ec41
    key: S4E9
    text: Patrick Jane y el BIC investigan la explosión del coche de una ex estrella de la NFL que casi termina con su vida. Tras una intensa búsqueda, los agentes descubren que pudo ser una bomba. Este caso es una oportunidad única para Patrick Jane, que tratará de averiguar el secreto que guarda la víctima, esta vez viva. Por su parte, Rigsby quiere llevar su relación con Sara al siguiente nivel mientras prepara un caso.
  - field: title
    hash: 7f78bd56cc20
    key: S4E9
    text: La camisa roja
  - field: synopsis
    hash: 6f06f07b479d
    key: S5E1
    text: La tensión entre el FBI y el BIC sigue en aumento tras la fallida operación de captura de Red John con la que finalizó la cuarta temporada. El equipo de Teresa Lisbon debe trabajar con el agente Mancini, y deberán dejar a un lado las diferencias para evitar que el escándalo salga a la luz y descubrir al autor de un doble asesinato. Una pelea, un sabotaje y la discusión por la custodia de Lorelei, colaboradora de Red John, harán que la situación salte por los aires.
  - field: title
    hash: c6d29186de07
    key: S5E1
    text: El ticket carmesí
  - field: synopsis
    hash: 09a6a904b2fc
    key: S5E10
    text: La muerte de un joven botánico lleva al BIC hasta el lucrativo mundo de la venta de marihuana con fines terapéuticos. El equipo de intervención rápida del BIC solicita la colaboración del agente Cho, que durante una misión se encontrará de bruces con la que fuera su novia y confidente, Summer.
  - field: title
    hash: 45c7f63de972
    key: S5E10
    text: Marihuana roja
  - field: synopsis
    hash: 9ac1b58b9e63
    key: S5E11
    text: El BIC visita un centro de rehabilitación californiano durante la investigación de la muerte de una joven modelo que recibía terapia allí. Mientras tanto, Teresa Lisbon retoma su investigación sobre el millonario Tommy Volker (al que da vida el actor de Perdidos Henry Ian Cusick). El capítulo cuenta con la aparición estelar de la actriz Mary Lynn Rajskub, que da vida a una paciente del centro de rehabilitación.
  - field: title
    hash: c5b57f33a9c5
    key: S5E11
    text: Días de vino y rosas
  - field: synopsis
    hash: 6b106385733d
    key: S5E12
    text: Un asesinato cometido hace meses podría ser la ayuda que Teresa Lisbon está esperando para poder capturar definitivamente a Tommy Volker. El BIC investiga la muerte de un geólogo, un crimen que Teresa Lisbon está segura será la clave que consiga llevar al multimillonario a prisión.
  - field: title
    hash: 46fa246ce9a0
    key: S5E12
    text: El cochecito rojo
  - field: synopsis
    hash: 3d1234bfd397
    key: S5E13
    text: ¿Ha dado Patrick Jane finalmente con el origen de Red John? El BIC investiga un caso que se remonta 25 años atrás, y en el que parecen estar conectados la secta Visualiza y el asesino de la familia de Patrick Jane. Mientras tanto, Teresa Lisbon se plantea si su futuro está en el BIC.
  - field: title
    hash: c4dc687a3617
    key: S5E13
    text: La caseta roja
  - field: synopsis
    hash: c51fc6d64be8
    key: S5E14
    text: El equipo del BIC se adentra en el mundo sorprendentemente feroz de los académicos en un caso que involucra a un estudiante en un museo de historia natural. El actor de "Supernatural" Rob Benedict interpreta a un profesor adjunto y Zuleikha Robinson, de "Homeland", da vida a una científica.
  - field: title
    hash: c93b461db93c
    key: S5E14
    text: Con uñas rojas y dientes
  - field: synopsis
    hash: 4c89f77f565b
    key: S5E15
    text: Patrick Jane y el equipo del BIC investigan el asesinato de la anciana millonaria Vogelson Elise (interpretada por la estrella invitada Mariette Hartley), cuyos restos son encontrados en la sala de su mansión fantasmagórica.
  - field: title
    hash: cfa5ebbff362
    key: S5E15
    text: Esmalte de uñas rojo charol
  - field: synopsis
    hash: 4b33e28059e9
    key: S5E16
    text: Lorelei Martins vuelve, determinada a averiguar si realmente Red John tuvo algo que ver con la muerte de su hermana. Con la vuelta de Lorelei, Patrick Jane se ve obligado a confesarle a Teresa Lisbon su papel en la huida de prisión de la joven cómplice del asesino de su familia.
  - field: title
    hash: f3b3846f828f
    key: S5E16
    text: Correrá la sangre
  - field: synopsis
    hash: 7c30bdbeff83
    key: S5E17
    text: El equipo del BIC investiga la aparición del cuerpo de una médico de la Marina, que es encontrado cerca de una base militar. La mujer fallecida trabajaba en la atención de soldados que sufren Síndrome de Estrés Postraumático.
  - field: title
    hash: 4c080a55c6ad
    key: S5E17
    text: Rojo, blanco y azul
  - field: synopsis
    hash: 366cec569b86
    key: S5E18
    text: La joven solista de una producción musical aparece muerta la noche del estreno. El BIC investiga el asesinato, en el que se mezclan las ambiciones del reparto con la obsesión de los productores por conseguir financiación. Mientras tanto, Patrick Jane sigue intentando conseguir información sobre Red John de Jason Lennon, que sigue en coma en el hospital.
  - field: title
    hash: a7fe68e4bbf5
    key: S5E18
    text: Detrás del telón rojo
  - field: synopsis
    hash: 84c2606f50a5
    key: S5E19
    text: El equipo de Teresa Lisbon viaja a un decadente pueblo turístico al estilo 'salvaje oeste', donde el dueño es encontrado muerto. Mientras tanto, Kirkland trata de averiguar cuánto sabe realmente Patrick Jane sobre Red John.
  - field: title
    hash: 42e818030cfa
    key: S5E19
    text: Un día marcado en escarlata
  - field: synopsis
    hash: b9a508f88962
    key: S5E2
    text: Mientras investiga el asesinato de un tallador de diamantes, Patrick Jane ingiere sin saberlo un narcótico y tiene alucinaciones con su hija fallecida.
  - field: title
    hash: d414f66ab3cd
    key: S5E2
    text: La cereza del diablo
  - field: synopsis
    hash: 4c5b1aa1743d
    key: S5E20
    text: Rigsby y Van Pelt se hacen pasar por una pareja con problemas en su relación, para investigar la muerte de una mujer que recibía consejos sentimentales de un especialista en relaciones en la radio.
  - field: title
    hash: 2b68b67144bf
    key: S5E20
    text: Pastelitos de terciopelo rojo
  - field: synopsis
    hash: 10ddfc1726c8
    key: S5E21
    text: J.J. LaRoche pide personalmente la ayuda de Patrick Jane. El cofre que ha escondido en su caja fuerte durante nueve años ha sido robado de su propia casa.
  - field: title
    hash: 7b988ef8008f
    key: S5E21
    text: Desazón roja
  - field: synopsis
    hash: bcd2e0957433
    key: S5E22
    text: Justo cuando Patrick Jane reduce la lista de sospechosos sobre la verdadera identidad de Red John a solo siete personas, el despiadado asesino golpea de nuevo. La víctima está relacionada con el pasado de Patrick Jane.
  - field: title
    hash: ee691be702eb
    key: S5E22
    text: Las reglas de Red John
  - field: synopsis
    hash: e13e07077c54
    key: S5E3
    text: El BIC investiga la muerte de un empleado de banca que fue asesinado durante un atraco. Las pistas hacen pensar a Patrick Jane que podría tratarse de un trabajo orquestado desde dentro. Los problemas entre el equipo de Teresa Lisbon y los hombres del FBI se recrudecen.
  - field: title
    hash: ab33ffa065ce
    key: S5E3
    text: Ni un centavo rojo
  - field: synopsis
    hash: a024f10907b7
    key: S5E4
    text: Rigsby recibe una llamada por un tiroteo con víctimas a las afueras, en Carson Springs (California). Se trata del asesinato de un peluquero local en plena calle y Patrick Jane con su agudeza habitual pronto averiguará que un hombre herido también está implicado. Lo localizan y descubren que se trata de Steve Rigsby, padre del agente Wayne Rigsby. Todo va a complicarse cuando el progenitor, hospitalizado, pone pies en polvorosa.
  - field: title
    hash: 152c19ee5dc1
    key: S5E4
    text: Contienda de sangre
  - field: synopsis
    hash: b89e0b1d7a52
    key: S5E5
    text: El capítulo 100 cuenta cómo fue el primer caso de Patrick Jane en el BIC y cómo conoció a sus compañeros de trabajo y amigos. También muestra cómo Patrick Jane pasó de ser un devastado padre y marido en busca de información sobre Red John a ser el asesor del BIC. En el capítulo regresará Gregory Itzen como director del BIC.
  - field: title
    hash: 87ac2cb20114
    key: S5E5
    text: Amanecer rojo
  - field: synopsis
    hash: ec510f2a78b5
    key: S5E6
    text: Patrick Jane sigue indagando para averiguar quién permitió la salida de Lorelei de la cárcel. Mientras tanto, aparece el cadáver de un guardia de seguridad con dos impactos de bala. Pronto localizan a un hombre llamado Isaac Goodwin que asegura estar por la zona para recoger el correo de su hermano y su mujer que están de viaje, pero Patrick Jane y Teresa Lisbon descubren que Marcus y Pella Goodwin han sido secuestrados y su hermano no ha hablado con la policía porque le habían asegurado que los matarían si les avisaba. Aparentemente podrían haber cometido un error al confundirse con la identidad de la pareja.
  - field: title
    hash: d55f3131d433
    key: S5E6
    text: Criba de cerezas
  - field: synopsis
    hash: 3afc88c9d0eb
    key: S5E7
    text: El BIC investiga el asesinato de una periodista, mientras Patrick Jane insiste en su búsqueda de Lorelei. El mítico actor de Perdidos Henry Ian Cusick encarna en este Capítulo a Tommy Volker, un playboy multimillonario que se convierte en sospechoso.
  - field: title
    hash: 06ac74892195
    key: S5E7
    text: Sangre en exclusiva
  - field: synopsis
    hash: d19875ed8ce8
    key: S5E8
    text: Con la ayuda de Brett Stiles, al que da vida Malcolm McDowell, Patrick Jane orquesta un elaborado plan para sacar a Lorelei Martins de prisión con la intención de que lo conduzca hasta Red John. Simon Baker dirige por tercera vez un episodio de la serie que protagoniza.
  - field: title
    hash: aeaaaa20694e
    key: S5E8
    text: Velas rojas al atardecer
  - field: synopsis
    hash: a6081277eb2a
    key: S5E9
    text: El BIC investiga la muerte de un agente inmobiliario con antiguos problemas con las bandas. Mientras tanto, Patrick Jane sigue buscando pistas de su nueva conexión con Red John. La actriz de Miénteme Mónique Gabriela Curnen da vida a Tamsin Wade, agente de la unidad de bandas del BIC.
  - field: title
    hash: ff5a92eced6b
    key: S5E9
    text: Rojo cereza
  - field: synopsis
    hash: f0f395a34b65
    key: S6E1
    text: "Patrick Jane y Teresa Lisbon mantienen en secreto sus pesquisas para averiguar la misteriosa identidad de Red John a partir de la lista de siete sospechosos: Bret Stiles, Gale Bertram, Ray Haffner, Reede Smith, Robert Kirkland, Brett Partridge y el sheriff Thomas McAllister. Mientras tanto, deberán descubrir quién está detrás de la muerte de un hombre que llevaba dos años desaparecido."
  - field: title
    hash: ffa270e2bb60
    key: S6E1
    text: La rosa del desierto
  - field: synopsis
    hash: 0f75212394dd
    key: S6E10
    text: "Muy a regañadientes, Patrick Jane acepta trabajar para el FBI. El excéntrico consultor solo pone una condición: que Teresa Lisbon se una al equipo. Un nuevo mundo se abre para Patrick Jane y para el FBI. El primer caso: buscar a un programador informático desaparecido. ¿Funcionará realmente la colaboración entre ellos?"
  - field: title
    hash: 5f7944d31421
    key: S6E10
    text: Brotes verdes
  - field: synopsis
    hash: "352e11508208"
    key: S6E11
    text: La nueva misión del FBI es encontrar al asesino de varios agentes de la DEA. Patrick Jane se citará con una hermosa mujer que tiene relación con el caso.
  - field: title
    hash: 335a103f28e9
    key: S6E11
    text: Rayas blancas
  - field: synopsis
    hash: 204a604cb9bf
    key: S6E12
    text: Patrick Jane y el FBI investigan el crimen de un cartógrafo que podría haber descubierto una red de espionaje antes de morir. Mientras tanto, Rigsby y Van Pelt se ven inmersos en una conspiración. El actor Navid Negahban (Homeland) da vida a Hassan Zarif, un hombre con información sobre el cartógrafo muerto.
  - field: title
    hash: a1ba35ecea08
    key: S6E12
    text: Martillo dorado
  - field: synopsis
    hash: bda5f3360b30
    key: S6E13
    text: El cadáver de un abogado estadounidense aparece en territorio mexicano, a pesar de que no hay ningún registro de que haya cruzado la frontera. Mientras, Rigsby y Van Pelt deberán convencer a JJ LaRoche de que les ayude a descubrir quién los está acosando.
  - field: title
    hash: 076e32949d4a
    key: S6E13
    text: Helicópteros negros
  - field: synopsis
    hash: d7592dd3e625
    key: S6E14
    text: Patrick Jane y Fischer investigan un asesinato en una reserva petrolífera, mientras Rigsby y Van Pelt viajan a Austin para unirse al resto del equipo e investigar los ataques que están sufriendo los exmiembros del BIC.
  - field: title
    hash: eff74c4552aa
    key: S6E14
    text: Agua gris
  - field: synopsis
    hash: 47df25bd3ae1
    key: S6E15
    text: El asesino que ha estado persiguiendo a los exmiembros del equipo del BIC secuestra a Grace Van Pelt. Patrick Jane se une a Rigsby en una desesperada carrera para salvarla, empleando todas sus habilidades deductivas para encontrarla antes de que sea tarde.
  - field: title
    hash: 0e66c3b00a7c
    key: S6E15
    text: Blanco como la nieve
  - field: synopsis
    hash: f203021136f5
    key: S6E16
    text: Patrick Jane embarca a sus colegas en una peligrosa aventura para atrapar a un equipo de ladrones de arte sin escrúpulos. Mientras, surge la chispa entre Teresa Lisbon y el agente Marcus Pike, de la brigada de arte del FBI.
  - field: title
    hash: fc4af0661570
    key: S6E16
    text: Violetas
  - field: synopsis
    hash: 8f9f10d803c0
    key: S6E17
    text: Patrick Jane y el FBI tratarán de demostrar la inocencia de un preso en el corredor de la muerte, al que solo quedan dos días para que se ejecute su sentencia. ¿Podrán resolver este antiguo caso antes de que llegue la hora?
  - field: title
    hash: b914a83d83b5
    key: S6E17
    text: Las alas plateadas del viento
  - field: synopsis
    hash: 9901be4ca1a5
    key: S6E18
    text: Una joven aparece muerta en las inmediaciones de un apartado club social para hombres. Patrick Jane debe encontrar la forma de entrar en esta elitista hermandad, de la que forman parte hombres muy poderosos, para encontrar al asesino.
  - field: title
    hash: a729f77a9bb8
    key: S6E18
    text: Verde bosque
  - field: synopsis
    hash: 108a6f6d6463
    key: S6E19
    text: Un encuentro casual con un hombre sospechoso lleva a Patrick Jane y Teresa Lisbon a descubrir una gran red de tráfico de seres humanos. Mientras, Teresa Lisbon se siente tentada a aceptar la oferta del agente Marcus Pike (interpretado por Pedro Pascal), que le pide que se traslade a Washington con él.
  - field: title
    hash: 7a983ab2b3fc
    key: S6E19
    text: Chicas de ojos castaños
  - field: synopsis
    hash: 797da9a4f450
    key: S6E2
    text: Patrick Jane descubre una pista muy importante sobre los métodos de Red John mientras el equipo del BIC se encuentra con cuatro de los siete sospechosos de ser en realidad el escurridizo asesino. Paralelamente, Teresa Lisbon investiga, con la ayuda de Patrick Jane, el asesinato de un ingeniero informático a manos de un drone.
  - field: title
    hash: f8519cf340b6
    key: S6E2
    text: Cardenal de alas negras
  - field: synopsis
    hash: fa96771b846b
    key: S6E20
    text: Un jurado de acusación se plantea juzgar a Patrick Jane por el asesinato de Red John. Mientras tanto, Teresa Lisbon trata de averiguar cómo Patrick Jane se siente ante la posibilidad de su salida de Austin con el Agente Pike para obtener nuevas pistas sobre la red de contrabando humano que han descubierto recientemente.
  - field: title
    hash: 1d5e0bc5542e
    key: S6E20
    text: La mesa blanca
  - field: synopsis
    hash: 65e0ee987b5a
    key: S6E21
    text: Sin tiempo que perder para salvar a las víctimas de una banda de secuestradores antes de que sean transportadas al extranjero, Patrick Jane y Teresa Lisbon consiguen acercar al autor intelectual de la organización criminal. Mientras tanto, Teresa Lisbon decide si se sumará a la nueva misión junto al agente Pike.
  - field: title
    hash: 04c47fbbe0ec
    key: S6E21
    text: Corazones negros
  - field: synopsis
    hash: 8c3246b9b85f
    key: S6E22
    text: Una pista en un antiguo caso obligará a Teresa Lisbon a retrasar sus planes de trasladarse a Washington con Marcus Pike, dándole tiempo a Patrick Jane para poner en orden sus sentimientos por ella y diseñar un plan de acción.
  - field: title
    hash: fd66373a38d0
    key: S6E22
    text: El pájaro azul
  - field: synopsis
    hash: d6c71d6774fa
    key: S6E3
    text: La obsesión de Patrick Jane por averiguar la identidad de Red John hace que involucre al equipo del BIC en un caso en Napa, en los dominios del Sheriff McAllister, uno de los sospechosos de esconder la identidad del criminal que asesinó a su familia. Mientras tanto, Van Pelt y Rigsby se dan finalmente el "sí quiero".
  - field: title
    hash: 710a796ab3fd
    key: S6E3
    text: Boda en rojo
  - field: synopsis
    hash: 1a33e97016b5
    key: S6E4
    text: Patrick Jane admite que le han robado una lista falsa de sospechosos de ser Red John, por lo que el BIC se da cuenta de que los hombres inocentes de la lista están en peligro. En este episodio, la actriz Aunjanue Ellis vuelve a ponerse en la piel de la que fuera directora del BIC, Madeline Hightower.
  - field: title
    hash: b0e43fe94e23
    key: S6E4
    text: En la lista roja
  - field: synopsis
    hash: 53bab2a41786
    key: S6E5
    text: Un miembro muy conocido de la secta Visualiza aparece muerto. Patrick Jane investiga el caso con la esperanza de que pueda llevarle a una nueva pista de la identidad de Red John.
  - field: title
    hash: 112f47b20c6e
    key: S6E5
    text: Tatuaje rojo
  - field: synopsis
    hash: 07c69453e139
    key: S6E6
    text: Con una pista definitiva que resolverá la identidad de Red John, Patrick Jane decide juntar a todos los sospechosos en el mismo lugar, para obligar al asesino a revelar su identidad.
  - field: title
    hash: 6e57ce9b0e0e
    key: S6E6
    text: Fuego y azufre
  - field: synopsis
    hash: ab29b3216005
    key: S6E7
    text: Después de los impactantes acontecimientos en casa de Patrick Jane, la lista de sospechosos de ser Red John se ha reducido significativamente. La nueva prioridad del BIC es centrarse en los que quedan.
  - field: title
    hash: 7801e7705e3d
    key: S6E7
    text: El gran dragón rojo
  - field: synopsis
    hash: ff2ebfd8a8d3
    key: S6E8
    text: Patrick Jane se encuentra finalmente cara a cara con el asesino en serie al que lleva buscando desde que este mató a su esposa y a su hija. Durante 10 años, encontrar a Red John ha sido el único objetivo de Patrick Jane.
  - field: title
    hash: 10892f2dddf2
    key: S6E8
    text: Red John
  - field: synopsis
    hash: 37f74cf0c9ba
    key: S6E9
    text: Dos años después de poner fin al caso de Red John, Patrick Jane ha dejado todo atrás y disfruta de una relajada vida en el Caribe. Será entonces cuando le ofrecen una sorprendente oferta de trabajo que puede cambiar todo.
  - field: title
    hash: 25f3746686e2
    key: S6E9
    text: Mi paraíso azul
  - field: synopsis
    hash: 1faefa60b0c7
    key: S7E1
    text: Patrick Jane y Teresa Lisbon llevan unas semanas como pareja cuando deben investigar el asesinato de un agente infiltrado. Deciden mantener su relación en secreto ante sus colegas, incluyendo a la nueva incorporación del equipo, la joven Michelle Vega.
  - field: title
    hash: 3e7a5c866cb6
    key: S7E1
    text: Tan sólo el cielo azul
  - field: synopsis
    hash: b8cad98d2342
    key: S7E10
    text: Patrick Jane tomará medidas extremas cuando el FBI intenta detener a una peligrosa banda que asalta furgones blindados, antes de que la desesperación de los ladrones cueste más vidas inocentes.
  - field: title
    hash: 859b12ca8bc9
    key: S7E10
    text: Nada dorado puede permanecer
  - field: synopsis
    hash: 46dc7fe9d1df
    key: S7E11
    text: Un joven que dice tener poderes psíquicos ofrece su ayuda al FBI resolviendo un par de asesinatos, pero termina llevando al equipo a encontrar otras víctimas. Patrick Jane comienza a sospechar que el psíquico es, de hecho, el asesino que todos están persiguiendo.
  - field: title
    hash: f75c763b4a52
    key: S7E11
    text: Bizancio
  - field: synopsis
    hash: 1149b684493f
    key: S7E12
    text: Patrick Jane acepta volver a ponerse en la piel del reconocido psíquico que fue en el pasado, y ser usado como cebo para atrapar a un asesino en serie.
  - field: title
    hash: 0b813d3f473d
    key: S7E12
    text: Alfombra de pelo marrón
  - field: synopsis
    hash: d22090e70534
    key: S7E13
    text: En el episodio final de la serie, Teresa Lisbon acepta la sorprendente propuesta de matrimonio de Patrick Jane, pero la búsqueda de venganza de un asesino puede costarles el final feliz por el que han trabajado tan duro.
  - field: title
    hash: a493866c200d
    key: S7E13
    text: Orquídeas blancas
  - field: synopsis
    hash: ce17a0e84a91
    key: S7E2
    text: Teresa Lisbon se infiltra como reclusa en una prisión para conseguir hacerse con la confianza de una mujer prisionera, de modo que ésta lleve al FBI hasta su novio, el líder de una banda que roba coches de lujo.
  - field: title
    hash: d7ec3757da14
    key: S7E2
    text: El hotel de las barras grises
  - field: synopsis
    hash: 458a71770888
    key: S7E3
    text: Patrick Jane y Teresa Lisbon viajan a Beirut en una peligrosa misión. Allí deberán trabajar con una vieja conocida de Patrick Jane, la explosiva mujer fatal Erica Flynn (interpretada por Morena Baccarin), que decide ayudar al FBI a detener a su actual novio, un enlace entre organizaciones terroristas. A cambio, Erica pide una amnistía por sus crímenes pasados.
  - field: title
    hash: 5f1108464fcb
    key: S7E3
    text: Helado de flor de naranjo
  - field: synopsis
    hash: df82bf4c16fe
    key: S7E4
    text: El equipo del FBI investiga un crimen relacionado con una operación de diamantes falsos, pero una repentina enfermedad obliga a Patrick Jane a dirigir a sus colegas desde la oficina, mientras se recupera. Mientras, Abbott está preocupado por si aspectos turbios de su pasado podrían dañar la reputación de su esposa, privándola de obtener un puesto muy prestigioso en Washington.
  - field: title
    hash: 886b8c03b5b7
    key: S7E4
    text: Mercado negro
  - field: synopsis
    hash: 9634cd206671
    key: S7E5
    text: Patrick Jane se encuentra por casualidad con un coronel (interpretado por Aaron Raymond), lo que le llevará a pensar que el oficial esconde algo. Patrick Jane tratará de reabrir el caso de asesinato de la mujer del coronel.
  - field: title
    hash: 31e2af24a32a
    key: S7E5
    text: El maletín plateado
  - field: synopsis
    hash: 749ba4fe1caa
    key: S7E6
    text: El FBI debe revisar una redada de la DEA que terminó en chapuza. Es entonces cuando el exjefe de Abbott trata de chantajearlo para que el error de la agencia antidroga no salga a la luz. Abbott deberá elegir entre su ética y su carrera.
  - field: title
    hash: 26f338e8b84d
    key: S7E6
    text: Luz verde
  - field: synopsis
    hash: 4295b9890d7d
    key: S7E7
    text: La investigación de un crimen se convierte en algo personal para Teresa Lisbon cuando se da cuenta de que su hermano pequeño, Jimmy, se busca como testigo clave.
  - field: title
    hash: 0f1429448fdc
    key: S7E7
    text: Una casita amarilla
  - field: synopsis
    hash: 4a4b7b4c19fe
    key: S7E8
    text: Patrick Jane se preocupa por la seguridad de Teresa Lisbon cuando el equipo se pone en el medio de la línea de tiro de un asesino, tratando de proteger a un testigo en una investigación de asesinato.
  - field: title
    hash: 389bb1bdf7bc
    key: S7E8
    text: El blanco de sus ojos
  - field: synopsis
    hash: 428e4a302b11
    key: S7E9
    text: Cuando el antiguo jefe de Abbott, el agente Peterson, amenaza con destruir la carrera del jefe de Patrick Jane y Teresa Lisbon, y posiblemente su libertad, Patrick Jane idea un arriesgado plan para proteger el futuro de su amigo.
  - field: title
    hash: e18fd71fc016
    key: S7E9
    text: La bala de cobre
