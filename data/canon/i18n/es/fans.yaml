    text: Su fecha de nacimiento no está clara. En el episodio "Byzantium", la fecha de nacimiento en su licencia de conducir es el 30 de julio de 1969, que es de hecho también la fecha de nacimiento de Simon Baker, lo que hace evidente que en esa escena vemos la licencia de conducir de Baker. Podemos ver otra fecha de nacimiento en el final de la serie, "White Orchids", en el que su fecha de nacimiento en su acta de matrimonio es el 16 de septiembre de 1974. Sin embargo, la cronología de la serie encaja mejor con la fecha de nacimiento de 1969. En el episodio "Throwing Fire", la fecha de un flashback de un Jane adolescente es 1986. Jane aparece ahí con unos dieciséis o diecisiete años.
