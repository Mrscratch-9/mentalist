    text: El episodio "If It Bleeds, It Leads" muestra una de dos ocasiones en que Jane y Lisbon tienen una discusión de pareja realista, en la que Lisbon rechaza con enojo su ayuda (él ofrece muy poco y muy tarde) y Jane golpea la mesa, molesto y exasperado, cuando ella se va hecha una furia. Otra discusión importante ocurre en "The Crimson Ticket", cuando Lisbon escucha el interrogatorio de Jane a Lorelei a pesar de que él le pidió que no lo hiciera, y luego lo confronta, molesta porque se pasó de la raya y creyendo que Lorelei lo está manipulando. Jane expresa su decepción porque Lisbon se echó para atrás en su palabra, a lo que ella responde "Don't be childish. I'm not your girlfriend, I'm an officer of the law.", y se niega a escucharla, insistiendo en que él está manipulando a Lorelei y haría cualquier cosa para llegar a Red John. También tienen una discusión similar en "The Desert Rose", donde ella se va después de una pelea sobre contarle a Van Pelt los nombres de la lista, y él corre tras ella, gritándole que se detenga y golpeando el auto para intentar que lo haga. En cualquier otro conflicto, Jane mantiene un desapego divertido o recurre a bromas. Hubo una discusión similar en el Piloto, pero la escena fue eliminada del producto final.
