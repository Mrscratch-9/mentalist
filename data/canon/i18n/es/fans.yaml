    text: El pueblo ficticio donde transcurre este episodio, Marquesas, es un guiño al autor de Moby Dick, Herman Melville. El libro de Melville se basa en parte en sus propias experiencias como ballenero. Se unió a la tripulación del "Acushnet" a principios de 1841, pero desertó porque las condiciones a bordo le resultaban insoportables. Melville abandonó el barco en la primera parada, Nuku Hiva, capital de las islas Marquesas.
