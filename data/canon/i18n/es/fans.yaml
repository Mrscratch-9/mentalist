    text: 'Jane: Alfil a C4 (Jane luego dice "forced to mate in 3 moves" y sonríe). Es muy probable que la partida de ajedrez de este episodio esté basada en la partida 6 del Campeonato Mundial de Ajedrez de 1972, entre Boris Spassky y Bobby Fischer. Las jugadas de apertura son las mismas, y todos los movimientos de Jane también ocurren en la partida del campeonato, notablemente la brillante Txf6 (Torre toma Caballo en f6) en la jugada 38, sacrificando la calidad para eliminar al atacante de la Dama blanca y creando un ataque ganador. El único movimiento que no está en Fischer vs. Spassky es el f4 de Bunting (Peón a f4), potencialmente un error de memoria del actor que interpreta a Bunting, o un detalle de relleno en el guion para crear una ilusión de contrajuego. Si Fischer vs. Spassky fue efectivamente la partida jugada en el episodio, la afirmación de Jane de que hay un mate forzado en tres también es incorrecta. En la partida real, las jugadas fueron 40. Ac4 Rh8 41. Df4!, dejando a Fischer con un mate forzado en siete jugadas.'
