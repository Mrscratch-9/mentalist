    text: El condado de Napa, el lugar de origen de Red John, es también el escenario de un asesinato cometido por un asesino en serie real, el célebre Asesino del Zodíaco, quien asesinó allí a una joven e hirió a su acompañante en el lago Berryessa en 1969, de manera similar al modus operandi de Red John. El asesino nunca fue identificado y el caso sigue abierto hasta hoy. En el episodio "Redline" de la segunda temporada, Jane y Lisbon se van en un Mercedes Benz que les prestó Walter Mashburn para almorzar en un restaurante del condado de Napa. De manera similar, en el episodio "Red Carpet Treatment" de la tercera temporada, Craig O'Laughlin, cómplice de Red John, lleva a Van Pelt a almorzar al condado de Napa. Esto ocurrió mucho antes de que se revelara la identidad de Red John como el sheriff Thomas McAllister. El cuchillo que usó Red John en "Red Sky in the Morning" y el similar que compró Jane en "Always Bet on Red" para incriminar a Maier por la muerte de Panzer es un cuchillo de viñedo que se usa para el cuidado de las vides. Los viñedos son la principal actividad agrícola del condado de Napa.
