  - author: Fandom contributors
    body: "Jane: Bishop to C4 (Jane then states \"forced to mate in 3 moves\" and smiles). It is very likely that this episode's game of chess is based on game 6 of the World Chess Championship 1972, between Boris Spassky and Bobby Fischer. The opening moves are the same, and all of Jane's moves occur in the championship game as well, notably the brilliant Rxf6 (Rook takes Knight on f6) on move 38, sacrificing the exchange to remove the White Queen's attacker and creating a winning attack. The only move not in Fischer vs. Spassky is Bunting's f4 (Pawn to f4) - potentially a recall error from the actor playing Bunting, or a bit of fluff in the script to create an illusion of counterplay. If Fischer vs. Spassky was indeed the game played in the episode, Jane's claim that there's a forced mate in three is also wrong. In the real game, the moves were 40. Bc4 Kh8 41. Qf4!, leaving Fischer with a forced mate in seven moves."
    key: t-bfe8b026c438
    spoils_up_to: S2E23
    tags:
      - trivia
    title: 'Jane: Bishop to C4 (Jane then states "forced…'
    url: https://thementalist.fandom.com/wiki/18-5-4?oldid=50407
