    body: Napa County, Red John's home place, is also the scenario of a murder scene by a real life serial killer, notorious Zodiac Killer, who murdered a young woman and injured her companion there in Lake Berryessa in 1969, in a similar fashion to Red John's modus operandi. The killer was never identified and the case remains open to this day. In the season two episode "Redline", Jane and Lisbon drive off in a Mercedes Benz lent to them by Walter Mashburn to have lunch at a restaurant in Napa County. Similarly, in the season three episode "Red Carpet Treatment", Craig O'Laughlin, a Red John accomplice, takes Van Pelt to lunch in Napa County. This happened long before Red John's identity as Sheriff Thomas McAllister was revealed. The knife used by Red John in "Red Sky in the Morning" and the similar one purchased by Jane in "Always Bet on Red" to frame Maier for Panzer’s death is a vineyard knife which is used in the care of grape vines. Vineyards are the primary agricultural pursuit in Napa County.
