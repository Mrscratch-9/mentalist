    body: The episode "If It Bleeds, It Leads" shows one of two instances of Jane and Lisbon having a realistic couple's disagreement in which Lisbon petulantly refuses his help (he offers too little too late) and Jane smacks the table, upset and exasperated, when she leaves in a huff. Another important disagreement happens during "The Crimson Ticket", when Lisbon listens to Jane's interrogation of Lorelei despite him asking her not to, and then confronts him, upset that he went over the hedge and believing Lorelei is playing him. Jane expresses disappointment in Lisbon going back on her words, to which she replies "Don't be childish. I'm not your girlfriend, I'm an officer of the law.", and refuses to listen to her, insisting that he is playing Lorelei and would do anything to get to Red John. They also have a similar disagreement in "The Desert Rose" where she leaves after an argument about telling Van Pelt about the names on the list, and he chases after her, yelling at her to stop and slaps the car trying to get her to do so. In every other conflict, Jane maintains an amused detachment or engages in humorous banter. There was a similar discussion in Pilot but the scene was deleted from the final product.
