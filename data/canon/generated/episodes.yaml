  - code: S6E3
    details: ""
    synopsis: Jane gets the CBI involved in a case in Napa in order to focus on Sheriff McAllister, while Van Pelt and Rigsby take a trip down the aisle.
    title: Wedding in Red
  - code: S6E4
    details: ""
    synopsis: Jane reveals that a list of fake Red John suspects he planted was stolen, and the team realizes these men are in danger.
    title: Red Listed
  - code: S6E5
    details: ""
    synopsis: When a prominent member of Visualize is mysteriously killed, Jane investigates in the hopes that the case will provide a clue that will lead him to Red John.
    title: The Red Tattoo
  - code: S6E6
    details: ""
    synopsis: With the final clue in hand, Jane attempts to gather the remaining Red John suspects in one place in hopes of finally revealing his identity.
    title: Fire and Brimstone
  - code: S6E7
    details: ""
    synopsis: Following the shocking events at Jane's house, the Red John list is  narrowed down further, and the CBI's priority is the remaining suspects.
    title: The Great Red Dragon
  - code: S6E8
    details: ""
    synopsis: Patrick Jane finally comes face-to-face with Red John, the serial killer he’s tracked since the madman murdered his wife and daughter. For 10 years, Jane has doggedly hunted his nemesis in his search for justice.
    title: Red John
  - code: S6E9
    details: ""
    synopsis: Two years after the Red John case was  put to rest, Jane's newfound  peace is interrupted by a surprising job offer that could change  everything for him.
    title: My Blue Heaven
  - code: S6E10
    details: ""
    synopsis: The FBI reluctantly enlists Jane’s help to find a missing computer programmer, but he won’t help unless Lisbon is brought on board as well.
    title: Green Thumb
  - code: S6E11
    details: ""
    synopsis: The FBI is tasked with finding the killer of several DEA agents, and Jane goes on a date with a beautiful woman associated with the case.
    title: White Lines
  - code: S6E12
    details: ""
    synopsis: Jane and the FBI investigate the murder of a high-tech cartographer who may have unearthed a spy ring before his death. Meanwhile, Rigsby and Van Pelt find themselves on the trail of an alarming conspiracy.
    title: Golden Hammer
  - code: S6E13
    details: ""
    synopsis: Jane's investigation leads him to join a separatist commune after a U.S.  attorney is found dead in Mexico, even though there's no record of her  crossing  the border.  Also, Rigsby and Van Pelt convince J.J. LaRoche to  help them discover who is stalking former CBI members.
    title: Black Helicopters
  - code: S6E14
    details: ""
    synopsis: Jane and Fischer investigate a murder at an oil fracking site, while Rigsby and Van Pelt travel to Austin to help investigate suspects in the string of attacks on former CBI team members.
    title: Grey Water
  - code: S6E15
    details: ""
    synopsis: Grace is kidnapped by the killer who has been hunting former CBI members, but when the prime suspect appears to have an airtight alibi, Jane must rely on all his skills to locate her before time runs out.
    title: White as the Driven Snow
  - code: S6E16
    details: ""
    synopsis: Jane enlists his colleagues in a dangerous sting operation to catch a deadly team of art thieves. Meanwhile, sparks fly between Lisbon and an agent from the FBI’s art squad.
    title: Violets
  - code: S6E17
    details: ""
    synopsis: Jane and the FBI take up the cause of a death row inmate who has two days to prove his innocence before his sentence is carried out.
    title: Silver Wings of Time
  - code: S6E18
    details: ""
    synopsis: When a woman is found murdered near a remote men’s social club, Jane must find a way to insinuate himself into the insular group to find the killer.
    title: Forest Green
  - code: S6E19
    details: ""
    synopsis: A chance encounter with a suspicious-looking individual leads Jane and Lisbon to uncover a vast human smuggling ring. Meanwhile, Lisbon remains tempted by Pike’s offer to move to D.C. with him.
    title: Brown Eyed Girls
  - code: S6E20
    details: ""
    synopsis: Jane’s freedom is at stake when a grand jury is empanelled to decide if he should be tried for the murder of Red John. Meanwhile, Lisbon tries to find out how Jane feels about the possibility of her leaving Austin with Agent Pike, and Cho and Abbott follow new leads in the human smuggling ring they recently uncovered.
    title: Il Tavolo Bianco
  - code: S6E21
    details: ""
    synopsis: With time running out to save the victims of a kidnapping ring before they are transported overseas, Jane and Lisbon zero in on the criminal enterprise’s mastermind. Meanwhile, Lisbon decides if she will move to D.C. with Agent Pike.
    title: Black Hearts
  - code: S6E22
    details: ""
    synopsis: A new lead in a cold case requires Lisbon to delay her plans to leave for Washington, D.C., giving Jane time to finally come to terms with his feelings for her and decide on a course of action.
    title: Blue Bird
  - code: S7E1
    details: ""
    synopsis: Jane and Lisbon decide to keep their new relationship a secret from  their colleagues as they investigate the murder of an undercover agent.  Also, young, ambitious agent Michelle Vega joins the team.
    title: Nothing But Blue Skies
  - code: S7E2
    details: ""
    synopsis: Lisbon goes undercover as a prison inmate in order to get a convict to turn on her boyfriend, who is the leader of a high-end car theft ring.
    title: The Greybar Hotel
  - code: S7E3
    details: ""
    synopsis: Jane and Lisbon travel to Beirut where they must work with Jane's familiar adversary Erica Flynn, who agrees to help the FBI apprehend her boyfriend, a courier for terrorist organizations, in exchange for amnesty for her past crimes.
    title: Orange Blossom Ice Cream
  - code: S7E4
    details: ""
    synopsis: The team investigates a murder linked to a counterfeit diamond operation, but an illness forces Jane to direct his colleagues from the office as he recuperates. Meanwhile, Abbott is concerned that transgressions in his past could harm his wife’s chance to obtain a prestigious job in Washington, D.C.
    title: Black Market
  - code: S7E5
    details: ""
    synopsis: A chance encounter with a military colonel leads Jane to believe the soldier is hiding something, leading him to dig into closed murder case of the man’s wife.
    title: The Silver Briefcase
  - code: S7E6
    details: ""
    synopsis: The team is brought in to consult on a botched DEA raid, but when Abbott’s former boss tries to blackmail him into keeping the agency’s missteps quiet, Abbott is forced to choose between his career and his morals.
    title: Green Light
  - code: S7E7
    details: ""
    synopsis: A murder investigation becomes personal for Lisbon when she learns that her underachieving younger brother, Jimmy, is being sought as a key witness.
    title: Little Yellow House
  - code: S7E8
    details: ""
    synopsis: Jane worries for Lisbon’s safety when the team puts itself in the line of fire to protect the witness in a murder investigation from a skilled assassin.
    title: The Whites of His Eyes
  - code: S7E9
    details: ""
    synopsis: When Abbott's old boss, Agent Peterson, threatens Abbott's career - and possibly his freedom - Jane devises a risky plan to protect his friend's  future.
    title: Copper Bullet
  - code: S7E10
    details: ""
    synopsis: Jane takes extreme measures as the team tries to apprehend a deadly gang of armored car robbers before their desperation to remain free costs more innocent people their lives.
    title: Nothing Gold Can Stay
  - code: S7E11
    details: ""
    synopsis: A young man claiming to have psychic powers offers his help to the FBI in solving a pair of murders, but when he leads them to additional victims, Jane and the team begin to suspect that he is in fact the killer they're hunting.
    title: Byzantium
  - code: S7E12
    details: ""
    synopsis: Jane agrees to once again pretend to be a renowned psychic and be used as bait in an attempt to lure out a serial killer and give the FBI a chance to apprehend him.
    title: Brown Shag Carpet
  - code: S7E13
    details: ""
    synopsis: Lisbon accepts Jane's surprise marriage proposal, but a killer's quest for revenge may cost them the happy ending they've worked so hard to achieve.
    title: White Orchids
